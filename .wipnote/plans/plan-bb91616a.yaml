    - id: slice-14
      num: 14
      title: 'Anomalies as first-class objects: canonical event + derived table + dashboard panel'
      what: |
        Promote conflicts, stale indexes, failed/spooled hook writes, and
        duplicate-agent activity from opaque counters to first-class, navigable
        objects. The daemon (and reindex/db-health) emit anomaly records into the
        canonical events.ndjson append-only log; the NDJSON indexer — extended in
        this slice (reindex_otel_events.go today only parses OTel signals) — projects
        them into a derived `anomalies` table that rebuilds cleanly on reindex. A
        dashboard anomalies panel, driven by a named projection from slice-8, lists
        open anomalies with timestamp, kind, source, and a resolved/acknowledged
        state. Duplicate-agent detection source: the sessions/agent-activity table —
        "active" = a session with in-progress status whose last-update is within a
        liveness window AND that has claimed/started a given work item; two such
        overlapping on one feat/bug/spike id raises one anomaly.
      why: |
        The research doc treats divergence as expected in local-first systems and
        wants it surfaced as resolvable objects, not silent counters. Today fallback
        and busy counters exist only as numbers in /api/collector-status with no
        actionable UX (research doc, Item 6).
      files:
        - internal/anomaly/detector.go
        - internal/anomaly/index.go
        - cmd/wipnote/reindex_otel_events.go
        - cmd/wipnote/api_projections.go
        - plugin/static/dashboard
