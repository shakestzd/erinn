        - The NDJSON indexer recognizes anomaly records and the derived `anomalies` table rebuilds cleanly on reindex
        - Duplicate-agent detection queries the sessions/agent-activity table with an explicit 'active' definition (in-progress + liveness window + claimed work item)
        - A dashboard anomalies panel lists open anomalies with kind, source, timestamp, and an ack/resolve action
      effort: M
      risk: Med
      tests: |
        Integration: TestAnomaly_CanonicalAndDerived — force a spool-used event, assert NDJSON record + anomalies row.
        Integration: TestAnomaly_RebuildsOnReindex — wipe DB, reindex, assert anomalies table repopulates from NDJSON.
        Integration: TestDuplicateAgent_Flagged — two sessions active on one work item -> one anomaly record.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-dup-agent
          text: What defines duplicate-agent activity worth flagging, and from which table?
          answer: 'From the sessions/agent-activity table: two or more sessions that are in-progress, live within the liveness window, and have claimed/started the SAME work item (overlapping active windows on one feat/bug/spike id). The orchestrator convergence rule already treats this as a smell; the anomaly makes it visible.'
      critic_revisions:
