      questions:
        - id: q-dup-agent
          text: What defines duplicate-agent activity worth flagging?
          answer: Two or more active agent sessions mutating/claiming the same work item concurrently (overlapping active windows on one feat/bug/spike id). The orchestrator convergence rule already treats this as a smell; the anomaly makes it visible.
      decisions_notes: |
        **Trigger:** daemon/reindex/db-health emit an anomaly event when a divergence condition is detected.
        **State:** CANONICAL events.ndjson record (survives rebuild) + derived `anomalies` table (rebuildable) — the locked choice over derived-only (ephemeral) or per-anomaly .html (heaviest).
        **Payload:** {kind: conflict|stale_index|failed_hook_write|duplicate_agent, source, ts, detail, status: open|acked|resolved}.
        **Surfacing:** a named projection (slice-8) feeds the dashboard panel so anomalies stream live.
        **Rejected:** derived-only anomalies table (lost on reindex, not local-first); dedicated .wipnote/anomalies/*.html (maximally first-class but heaviest — revisit only if anomalies need full lineage/linking).
