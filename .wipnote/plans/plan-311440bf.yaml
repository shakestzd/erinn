meta:
    id: plan-311440bf
    track_id: trk-6a1f5362
    title: 'Explicit-intent launch: daemon-backed session resume + work-item-keyed worktrees'
    description: |
        Research basis:
        - https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents (checked 2026-06-16): continuity should live in a curated, always-loaded artifact layer ("attention budget"), not raw transcript replay.
        - https://tessl.io/blog/amp-retires-compaction-for-a-cleaner-handoff-in-the-coding-agent-context-race/ (checked 2026-06-16): Amp dropped automatic compaction for an explicit, user-reviewed /handoff — the field is moving away from auto-magic toward declared intent.
        - https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus (checked 2026-06-16): file/path-as-memory (reversible compaction) + todo.md; keep pointers in context, not contents.
        - https://code.claude.com/docs/en/worktrees (checked 2026-06-16): native --worktree, isolation:worktree, cleanupPeriodDays TTL sweep, worktree.baseRef, lock-during-run.
        - https://github.com/anthropics/claude-code/issues/46444 (checked 2026-06-16): open safety bug — Claude Code silently deletes uncommitted worktree work on startup. GC here MUST be snapshot-safe.
        - https://codex.danielvaughan.com/2026/04/11/codex-app-worktree-lifecycle-local-environments/ (checked 2026-06-16): Codex snapshots before deleting a managed worktree; ~15 active-worktree cap.
        - https://kiro.dev/docs/specs/ and https://github.github.com/spec-kit/ (checked 2026-06-16): industry lifecycle is Specify->Design->Tasks->Implement with typed artifacts (feature vs bugfix); neither models a first-class spike — wipnote already does.
        - runtime: internal/launcher/plan/plan.go (read 2026-06-16): PlanLaunch already keys isolation on RuntimeMode + WorkItemID + EnforceIsolation; EnsureForFeature/TrackStatus already REUSE an existing worktree on os.Stat hit.
        - runtime: core/db/schema.go sessions table (read 2026-06-16): stores transcript_path + canonical project_dir ("."), but NOT the exec worktree path/branch/harness — the missing link for routed resume.

        Replace auto-guessed worktree creation with a USER-DECLARED intent flow shared by all CLI launchers
        (claude/codex/gemini/antigravity). Bare interactive launch asks "continue prior work or start new?";
        the persistent daemon stores per-session state (work item, exec worktree, branch, harness, last
        activity) and serves a resumable-session index to a TUI chooser (and the web dashboard). "Continue"
        re-hydrates the durable WORK ITEM (not the transcript) and reuses its worktree; "new" creates a typed
        work item (plan/spike/feature/bug) which deterministically selects isolation. Worktrees are keyed by
        work item, never by session or CLI. Planning sessions run in-place read-mostly (no worktree). Cleanup
        is snapshot-safe. This repositions the earlier auto-adhoc-timestamp mode (feat-d805d64f) as the
        non-interactive fallback, with the explicit chooser as the primary path.

        Three-layer model enforced throughout: session (ephemeral context) != worktree (ephemeral fs,
        GC'd) != work item (durable continuity).
    created_at: ""
    status: draft
    schema_version: v3
    version: 1
design:
    problem: |
        wipnote can launch the CLIs but cannot help a user RESUME coherently or isolate predictably.
        Today: (1) the only resume is the harness's own transcript replay (claude --resume), which is
        directory-scoped and bloats context; (2) isolation is auto-inferred (RuntimeMode + WorkItemID),
        and the auto mode mints non-deterministic adhoc-<timestamp> worktrees that are unresumable and
        accumulate; (3) the sessions table never records which worktree/branch/harness a session ran in,
        so nothing can route a resume back to the right directory. Concurrent sessions on one shared
        checkout therefore collide (dirty main, stray commits on the wrong branch) — observed live during
        this design session. The fix is to make the user DECLARE intent and have wipnote implement it
        transparently, with the daemon as the durable session-state store.
    goals:
        - Explicit intent over inference — the user declares continue-vs-new and the work type; wipnote never silently guesses worktree behavior.
        - Continuity without context bloat — resume re-hydrates the durable work item + curated handoff, not the raw transcript (transcript resume is an optional same-day convenience).
        - Worktree keyed by WORK ITEM — reused across sessions, never per-session or per-CLI; planning runs in-place; bare exploration becomes a typed spike.
        - Daemon-backed resumable index — one harness-neutral source of truth surfaced by both a launch-time TUI and the web dashboard.
        - 'Snapshot-safe cleanup — empty spikes/worktrees are GC''d, but a worktree with uncommitted or unpushed work is NEVER removed without a snapshot (avoid Claude Code #46444 class of data loss).'
        - Backward compatible — flags and non-interactive/yolo/CI paths bypass the prompt; existing launch behavior is preserved when no intent is declared.
    constraints:
        - Canonical observability identity stays anchored to the main repo root via WIPNOTE_PROJECT_DIR + git-common-dir; worktrees are execution dirs only (delivered by plan-1670cacd / plan-2133adf2).
        - No new mandatory runtime dependency for the TUI — prefer an already-vendored TUI lib or a minimal stdlib prompt; record the adopt-vs-build outcome.
        - The interactive prompt must never block non-TTY, piped, yolo, or CI invocations; flags always win over the prompt.
        - 'Cross-harness: the chooser and daemon index are harness-neutral; only the final exec wiring differs per CLI (claude/codex/gemini/antigravity).'
        - Claims layer (LiveCollision) remains the concurrency guard — two live sessions on one work item are prevented at the claim level, not by spawning extra worktrees.
    approved: false
    comment: ""
slices:
    - id: slice-1
      num: 1
      title: Persist exec worktree path, branch, and harness per session
      what: |
        Record, at SessionStart, the session's actual execution context: the worktree/exec dir
        (from the CloudEvent CWD, normalized repo-relative), the git branch, and the harness
        (claude/codex/gemini/antigravity). Add nullable columns to the sessions table (or a sidecar
        table) and populate them in the SessionStart handler, which already has event.CWD available
        for gitdir repair but currently discards it. Canonical project_dir stays "." — these new
        fields describe WHERE execution happened, not the observability identity.
      why: |
        This is the missing link for routed resume. The sessions table stores transcript_path +
        canonical project_dir only; without the exec worktree/branch/harness, nothing can send a
        resume back into the correct directory, and the chooser cannot show meaningful rows.
      files:
        - core/db/schema.go
        - core/hooks/session_start.go
        - core/db/session_repo.go
      deps: []
      done_when:
        - A new session row records exec_worktree_path (repo-relative), branch, and harness.
        - 'Existing rows and DBs upgrade cleanly: columns are nullable; reindex of old HTML leaves them empty without error.'
        - project_dir remains canonical (".") — the new fields do not alter observability identity.
      effort: M
      risk: Med
      tests: |
        Unit: TestSessionStart_RecordsExecWorktree — event.CWD inside a linked worktree is stored repo-relative; main-worktree launch stores empty/".".
        Unit: TestSessionStart_HarnessDetected — harness derived from launch marker/env is persisted.
        Migration: opening a pre-migration DB adds columns without data loss.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-harness-source
          text: Where does the harness value come from — the .launch-mode marker or a launch env var?
          answer: The .launch-mode marker is the source of truth (writeLaunchMarker already records mode+pid+ts); fall back to a WIPNOTE_HARNESS env only if the marker is stale/absent.
      decisions_notes: |
        **State:** new nullable columns on the existing sessions table (SQLite read index), backfilled
        from event.CWD at SessionStart; canonical project_dir untouched.
        **Payload:** exec_worktree_path (repo-relative), branch, harness enum.
        **Rejected:** a separate sessions_exec table (extra join for every chooser query, no benefit at
        this cardinality); storing absolute paths (fails check-host-paths and breaks cross-host).
    - id: slice-2
      num: 2
      title: Daemon resumable-session index (query + CLI + API)
      what: |
        Build a harness-neutral resumable-session index served by the persistent daemon: a query that
        joins sessions to their work item and returns rows of {work_item_id, title, type, branch,
        exec_worktree_path, harness, last_activity, last_session_id, live?}. Expose it as
        `wipnote sessions resumable [--json]` and a daemon HTTP endpoint the dashboard and TUI consume.
        Rank by recency; mark items with a currently-live claim.
      why: |
        The chooser (slice 3) and dashboard (slice 6) need one authoritative, fast list of what can be
        resumed. Centralizing it in the daemon avoids each launcher reimplementing the query and keeps
        the index consistent with claim/liveness state already tracked there.
      files:
        - core/db/session_repo.go
        - cmd/wipnote/sessions.go
        - cmd/wipnote/api_sessions.go
      deps:
        - 1
      done_when:
        - '`wipnote sessions resumable --json` returns ranked rows with work item, branch, worktree, harness, last activity, and live flag.'
        - A daemon HTTP endpoint returns the same payload for the dashboard/TUI.
        - Liveness reflects the claims/heartbeat layer — a dead session's item shows resumable, a live one is flagged.
      effort: M
      risk: Med
      tests: |
        Unit: TestResumableIndex_RanksByRecency — most-recent activity first.
        Unit: TestResumableIndex_LiveFlag — item with a heartbeating claim is marked live; stale claim is not.
        Integration: TestSessionsResumableCLI — seed sessions, assert JSON shape + ordering.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-index-grain
          text: Index rows keyed by work item or by individual session?
          answer: By work item (the durable continuity unit), with last_session_id attached for the optional transcript-level resume — matches the two-level resume model in slice 4.
      decisions_notes: |
        **Trigger:** explicit CLI invocation and a daemon endpoint (not a hook) — read-only query path.
        **State:** derived from the sessions table + claims/liveness; no new persistent state.
        **Payload:** array of resumable rows keyed by work item, newest first, with a live boolean.
        **Rejected:** computing the index in each launcher (duplicated logic, drift); a new materialized
        table (the join is cheap at this scale and must not get stale vs liveness).
    - id: slice-3
      num: 3
      title: Interactive launch chooser (TUI) + intent flags, harness-neutral
      what: |
        On a bare interactive launch (TTY, no intent flags) of any CLI, show a continue-vs-new chooser.
        "New" prompts for the work TYPE — plan / spike / feature / bug — which deterministically selects
        isolation: plan => in-place read-mostly (NO worktree); spike/feature/bug => work-item-keyed
        managed worktree. Add/normalize intent flags across launchers: --continue, --work-item <id>,
        --new <type> "<title>", --in-place. Non-TTY, piped, --yolo, and CI ALWAYS bypass the prompt and
        fall back to the non-interactive policy (the repositioned auto/feat-d805d64f path). Print the
        resolved work item + worktree transparently before exec.
      why: |
        Implements the user-declared intent model: stop guessing, ask once, then implement exactly what
        the user chose. Mapping "new" to a typed work item makes the lifecycle phase explicit and gives
        the worktree decision a deterministic, non-magical basis.
      files:
        - cmd/wipnote/launcher_chooser.go
        - cmd/wipnote/launcher_mode.go
        - cmd/wipnote/claude.go
        - cmd/wipnote/codex.go
        - cmd/wipnote/gemini.go
        - cmd/wipnote/antigravity.go
      deps:
        - 2
      done_when:
        - Bare interactive launch with no flags shows the continue-vs-new chooser; choosing new asks the work type.
        - --continue / --work-item / --new / --in-place all bypass the prompt and behave deterministically.
        - Non-TTY, piped, --yolo, and CI never block on the prompt (verified by a non-TTY test).
        - Choosing 'plan' launches in-place with no worktree; spike/feature/bug create/enter a work-item-keyed worktree.
        - The resolved work item and worktree path are printed before the harness starts.
      effort: L
      risk: High
      tests: |
        Unit: TestChooser_NonTTYBypass — no TTY => no prompt, falls back to policy.
        Unit: TestChooser_NewTypeSelectsIsolation — plan=>in-place, spike/feature/bug=>managed worktree.
        Unit: TestIntentFlags_BypassPrompt — each flag short-circuits the chooser.
        Integration: TestLaunchChooser_PrintsResolvedTarget — asserts the transparency line.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-tui-lib
          text: Rich TUI library now, or minimal stdlib prompt for v1?
          answer: Audit go.mod first; adopt an already-vendored TUI lib if present, otherwise ship a minimal stdlib continue-vs-new + type prompt for v1 and file a follow-up for a richer picker — avoids a new dependency on the critical launch path.
      decisions_notes: |
        **Trigger:** bare interactive launch (isatty on stdin/stdout, no intent flag) of any CLI launcher.
        **State:** reads the slice-2 index; writes the chosen/created work item via existing work-item APIs.
        **Payload:** chooser returns {action: continue|new, work_item_id, type}; launcher maps to isolation.
        **Adopt-vs-build:** prefer an already-vendored TUI primitive (e.g. bubbletea/promptui if present
        in go.mod) over a hand-rolled raw-terminal loop; if none is vendored, use a minimal stdlib
        line-prompt for v1 and defer rich TUI — recorded so review can decide.
        **Rejected:** always-on prompt with no bypass (breaks scripts/yolo/CI); inferring intent then
        confirming (reintroduces the guessing the user explicitly rejected); per-CLI worktree axis
        (item x CLI explosion — CLI is the tool, work item is the isolation key).
    - id: slice-4
      num: 4
      title: Two-level resume with worktree reuse and routed re-entry
      what: |
        Implement "continue": pick a work item from the index, REUSE its existing worktree (the
        EnsureForFeature/TrackStatus reuse path — never create a second one), cd/exec into the recorded
        exec_worktree_path from slice 1, and inject the correct WIPNOTE_PROJECT_DIR (canonical root).
        Offer an optional second level: resume the last harness transcript for that item via the
        harness's own resume flag (claude --resume <id> etc.) for a same-day pickup; default is a fresh
        session re-hydrated from the work item, not a transcript replay.
      why: |
        Closes the continuity loop without bloat: the durable work item is the primary resume unit
        (curated, small), transcript replay is an explicit opt-in. Routing into the recorded worktree
        makes resume work regardless of the directory the user invoked wipnote from.
      files:
        - cmd/wipnote/launcher_mode.go
        - cmd/wipnote/claude.go
        - core/worktree/worktree.go
      deps:
        - 3
      done_when:
        - 'Continuing a work item re-enters its EXISTING worktree (asserted: no new worktree created).'
        - Resume routes into the recorded exec_worktree_path even when invoked from elsewhere, with canonical WIPNOTE_PROJECT_DIR.
        - Transcript-level resume is offered as an explicit second step and is not the default.
      effort: M
      risk: High
      tests: |
        Unit: TestContinue_ReusesWorktree — second continue on the same item reuses, created=false.
        Unit: TestResume_RoutesToRecordedWorktree — exec dir matches the stored path; project_dir canonical.
        Integration: TestTwoLevelResume_TranscriptOptional — work-item resume by default; --resume <id> opts into transcript.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-resume-default
          text: Default continue = fresh session re-hydrated from the work item, or transcript replay?
          answer: Fresh session re-hydrated from the work item is the default (durable-artifact continuity, no bloat); transcript replay is an explicit opt-in for same-day pickups.
      decisions_notes: |
        **Trigger:** chooser "continue" or --continue/--work-item with an item that has an existing worktree.
        **State:** reads slice-1 exec path + slice-2 index; reuses worktree via existing Ensure* reuse.
        **Payload:** launch into recorded worktree; optional harness --resume <last_session_id>.
        **Rejected:** transcript replay as the default (context-bloat path per Anthropic/Amp research);
        creating a fresh worktree on resume (defeats reuse, causes bloat + base divergence).
    - id: slice-5
      num: 5
      title: Snapshot-safe empty-spike and worktree GC
      what: |
        On SessionEnd, if the session ran a spike whose worktree has no commits, no staged/unstaged
        changes, and no untracked files, auto-complete the spike and remove its worktree (mirrors Claude
        Code's no-op-worktree cleanup). Add a TTL sweep for stale managed worktrees gated on the same
        emptiness check and on the run-lock. CRITICAL safety: NEVER remove a worktree that has
        uncommitted or unpushed work without first taking a snapshot (branch/stash ref or patch under
        .wipnote), explicitly avoiding the Claude Code #46444 silent-data-loss failure mode.
      why: |
        Keeps worktree/spike count bounded (the anti-bloat half of "every bare session = a spike")
        without the data-loss risk that auto-cleanup notoriously introduces.
      files:
        - core/hooks/session_end.go
        - core/worktree/cleanup.go
        - cmd/wipnote/config.go
      deps:
        - 1
      done_when:
        - A spike session ending with a clean worktree auto-completes the spike and removes the worktree.
        - A worktree with uncommitted/unpushed work is preserved AND snapshotted; it is never silently deleted.
        - TTL sweep respects the run-lock and the emptiness check; live worktrees are never swept.
        - Cleanup is opt-in/tunable via .wipnote/config.json and defaults conservatively.
      effort: M
      risk: High
      tests: |
        Unit: TestGC_RemovesEmptySpikeWorktree — clean worktree => removed + spike completed.
        Unit: TestGC_PreservesDirtyWorktree — uncommitted change => kept + snapshot recorded, not deleted.
        Unit: TestGC_RespectsLock — locked/live worktree is skipped by the TTL sweep.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-snapshot-form
          text: Snapshot dirty worktrees as a git stash/branch ref or a patch file under .wipnote?
          answer: A retained branch/ref (durable, restorable via git) is preferred over a loose patch; fall back to a patch under .wipnote only when a ref cannot be created. Either way, never delete without a recoverable snapshot.
      decisions_notes: |
        **Trigger:** SessionEnd hook (per-session) + a periodic daemon TTL sweep.
        **State:** reads git status of the worktree; writes spike completion + removes worktree dir;
        snapshot ref/patch stored under .wipnote on the dirty path.
        **Payload:** none external; emits a cleanup log line naming what was removed (no silent caps).
        **Rejected:** unconditional TTL deletion (the #46444 data-loss bug); summarizing/discarding dirty
        worktrees (lossy); GC keyed on session rather than worktree emptiness (would race live reuse).
    - id: slice-6
      num: 6
      title: Web dashboard resume view
      what: |
        Surface the slice-2 resumable index in the wipnote serve dashboard: a "Resume" panel listing
        resumable work items with branch, worktree, harness, last activity, and live status, each row
        showing the exact launch command to continue (e.g. `wipnote claude --work-item feat-X`).
        Read-only; reuses the same daemon endpoint as the TUI.
      why: |
        Gives a richer browse/management surface for resumption beyond the launch-time TUI, on the same
        single source of truth — so the terminal and web views never disagree.
      files:
        - cmd/wipnote/api_sessions.go
        - plugin/static/dashboard.js
      deps:
        - 2
      done_when:
        - The dashboard shows a Resume panel populated from the daemon resumable endpoint.
        - Each row displays the copy-paste launch command and live/idle status.
      effort: S
      risk: Low
      tests: |
        Integration: TestDashboardResumePanel — endpoint returns rows; panel renders them.
        Manual: smoke-test the panel in `wipnote serve --bind 0.0.0.0 --port 8088`.
      complexity: standard
      approved: false
      comment: ""
      questions:
        - id: q-web-actions
          text: Read-only command display, or actionable buttons that launch from the browser?
          answer: Read-only copy-paste command for v1 (launching a terminal CLI from a browser is an attack/UX surface); revisit actionable launch later.
      decisions_notes: |
        **Trigger:** dashboard page load fetching the slice-2 endpoint.
        **State:** none new; pure read view over the daemon index.
        **Rejected:** a second query path for the web (must share slice-2's endpoint so TUI and web agree).
questions: []
