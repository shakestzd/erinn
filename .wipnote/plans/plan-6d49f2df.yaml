meta:
    id: plan-6d49f2df
    track_id: trk-6a1f5362
    title: Optimize wipnote subagent delegation and token usage
    description: Plan to optimize token usage, prevent context bloat, support local subagent model configurations, and move execute dispatch logic to the Go CLI.
    created_at: "2026-06-17"
    status: draft
    priority: medium
    schema_version: v3
    version: 3
design:
    problem: Subagents and token usage (context sizes >150k, long sessions) exhaust users' token quotas too quickly.
    goals:
        - Lower subagent token usage by dynamically downgrading default models and turns
        - Prevent context size accumulation through automated /compact prompts and CLI output limits
        - Move parallel execute dispatch loop from agent prompt/chat to Go CLI command execution
        - Implement session inactivity auto-timeouts and GC for empty worktrees
    constraints:
        - Backward compatibility with existing YAML plans and SQLite db
        - No new external runtime dependencies (keep standard library + existing go.mod)
        - Cross-harness portability (must generate correct ports for Claude; Codex; Gemini; and Antigravity)
    approved: false
    comment: ""
