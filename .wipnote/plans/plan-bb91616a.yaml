meta:
    id: plan-bb91616a
    title: 'Local-first architecture: daemon write-owner, reactive projections, first-class anomalies'
    description: |
        Apply proven local-first architecture patterns to wipnote, validated against
        docs/research/local-first-architecture-for-wipnote.md. The spine is a
        per-project daemon that owns all SQLite writes, graduated from the existing
        serve_child writqueue (built in plan-ae0c37b2). Around that spine: reactive
        snapshot+delta SSE dashboard projections, an explicit rebuildable-derived
        contract for SQLite, and conflicts/stale-index/failed-hook-writes/duplicate-agent
        activity promoted to first-class anomaly objects.

        Direction locked via complex-interview:
          - Canonical = .wipnote/*.html + events.ndjson; SQLite = rebuildable derived index.
          - Daemon = graduated serve_child, Unix-socket IPC, client op-ID dedup window.
          - Writer behavior with no daemon: AUTO-SPAWN primary, spool last-resort only if
            spawn itself fails (e.g. hook sandbox cannot fork). Daemon is canonical design.
          - Rollout: direct canonical cutover, NO config flag / NO shadow mode. Single user
            (dogfooding) today; soak test + reindex-race fix are the safety net.
          - Reactive dashboard: named snapshot-then-delta SSE projections with monotonic seq
            and reconnect-resume.
          - Anomalies: emitted as canonical events.ndjson records + indexed into a derived
            anomalies table + surfaced via a dashboard projection panel.
          - OUT OF SCOPE: WASM boundary, DuckDB replacement, CRDT rewrite, cloud sync.

        Phasing: Phase A (slices 1-6) = daemon write-owner spine. Phase B (slice 7) =
        rebuildable-derived contract + DB-health observability + read-routing-by-shape.
        Phase C (slices 8-13) = reactive dashboard: daemon-push snapshot+delta projections,
        canonical-HTML document reads, and native (zero-dep) custom-element client components
        that patch fields. Phase D (slice 14) = first-class anomalies.

        Revised post-critique (2026-05-28): danger-level scope gaps from the dual-critic
        pass are folded in — headless writer-only serve_child mode is now explicit scope
        (slice 2), slice 5 enumerates all 13 intentionalCLIMutation sites and resolves the
        serve_child.go:100 owned-writer case, slice 10 owns the anomaly NDJSON indexer
        extension, slice 4 updates the boundary-test inventory, and op-format versioning +
        spool durability + persistent dedup + reindex self-deadlock are specified.

        Revised 2026-05-28 (post frontend review): two-tier topology (per-project writer +
        follow-on global coordinator trk-cb80b7da). Phase C expanded with daemon-push
        streaming, canonical-HTML document reads, and native zero-dep custom-element client
        components (verified against app.js / event-tree.js); streaming source = daemon
        append-notify (NOT a SQLite poll or a per-session NDJSON tail).
    created_at: ""
    status: draft
    schema_version: v3
    version: 1
design:
    problem: |
        wipnote's SQLite read index is written concurrently by multiple short-lived
        processes — dashboard (serve_child), hook subprocesses (dbgate), and 13 direct
        CLI mutation sites (openDB). This multi-writer topology causes recurring
        SQLITE_BUSY failures masked (not eliminated) by RetryOnBusy, and a real
        unsynchronized race between reindex checkpoint-reset (reindex_otel_events.go:46/140)
        and the live indexer. Meanwhile the dashboard mostly broad-polls JSON (and polls
        SQLite every 2s for plan feedback via planEventsHandler at api_plans.go:942),
        divergence/failure conditions surface only as opaque counters, and the
        canonical-vs-derived contract lives only in a test inventory.
    goals:
        - Make a single per-project daemon (graduated serve_child) the sole owner of SQLite writes, eliminating SQLITE_BUSY structurally rather than via retry.
        - Keep .wipnote/*.html + events.ndjson canonical and SQLite explicitly rebuildable-derived, with staleness visible to operators.
        - Replace broad dashboard polling with named snapshot+delta SSE projections that reconnect-resume.
        - Promote conflicts, stale indexes, failed/spooled hook writes, and duplicate-agent activity to first-class, resolvable dashboard objects.
        - 'Adopt a two-tier topology: per-project daemon = write-owner data plane (this plan); a global coordinator graduated from serve_global = control plane for supervision + cross-project monitoring/knowledge transfer (follow-on trk-cb80b7da). Design the per-project protocol coordinator-ready so the coordinator attaches with zero rework.'
    constraints:
        - Canonical artifacts are the source of truth; a writer must never block or lose a mutation because the daemon is unreachable (auto-spawn primary, spool last-resort).
        - Direct canonical cutover with NO config flag and NO shadow mode (single dogfooding user today); soak test + reindex-race fix are the safety net.
        - Reindex must remain a foreground command honoring the existing TMPDIR-safety contract — never backgrounded on volatile tmpfs.
        - 'The per-project write-owner is the sole write authority for its DB (failure isolation — one writer crash never blocks other projects); the global coordinator (trk-cb80b7da) never holds per-DB write locks. The slice-1 socket/envelope and slice-2 lease must be coordinator-ready: project_id in the envelope, registry-discoverable socket+lease.'
        - 'OUT OF SCOPE: WASM boundary, DuckDB replacement, CRDT rewrite, required cloud sync. No new runtime dependency beyond the existing go.mod.'
    approved: false
    comment: ""
slices:
    - id: slice-1
      num: 1
      title: Write-op protocol + Unix-socket listener over the serve_child writqueue
      what: |
        Define a transport-agnostic write-op envelope and expose the existing
        serve_child writqueue (internal/db/writequeue: Queue + WriteOp, op.go:46,
        queue.go:83 — in-process-only today) over a per-project Unix domain socket
        in .wipnote/. Envelope carries: op_format_version (for skew detection),
        client-supplied op_id (stable hash of the source event/mutation), op_type,
        payload, and an ack reply (applied | duplicate | error + monotonic seq).
        Add a WriterClient submit interface (dial socket, send op, await ack) and a
        dedup index inside the queue. Because the in-memory LRU does not survive a
        restart, dedup is backed by a durable last-applied marker (see slice 3) so
        a replayed op is dropped even across a daemon restart. No callers cut over
        in this slice — protocol + listener + ack channel only (the current queue is
        a channel-of-closures with no reply path; the {status, seq} ack is net-new).
      why: |
        The single-writer writqueue already exists inside serve_child but is only
        reachable in-process. Exposing it over a stable local socket is the
        precondition for every other writer (hooks, CLI, reindex) to route writes
        through one owner instead of opening SQLite directly — the structural fix
        for SQLITE_BUSY (research doc, Item 3).
      files:
        - internal/db/writequeue/op.go
        - internal/db/writequeue/queue.go
        - internal/daemon/socket.go
        - internal/daemon/client.go
        - cmd/wipnote/serve_child.go
      deps: []
      done_when:
        - serve_child binds a per-project Unix socket and accepts versioned write-op envelopes
        - WriterClient.Submit sends an op and receives an applied/duplicate/error ack with a monotonic seq
        - Submitting the same op_id twice returns duplicate on the second call, including across a simulated daemon restart (durable dedup marker)
        - An envelope with an unknown op_format_version is rejected with a clear error, not mis-applied
        - The envelope carries a project_id and the socket+lease are registry-discoverable so a future global coordinator (trk-cb80b7da) can attach with no protocol change
      effort: M
      risk: Med
      tests: |
        Unit: TestWriterClient_DedupWindow — same op_id twice -> applied then duplicate.
        Unit: TestEnvelope_VersionSkew — unknown op_format_version -> error, no apply.
        Integration: TestSocketRoundTrip — bind socket, submit op, assert row indexed + ack seq.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-transport
          text: Unix socket vs loopback HTTP for write-op submit?
          answer: Unix domain socket per project in .wipnote/ — local-only, no port allocation, matches local-first/no-network ethos. Abstracted behind WriterClient so HTTP could be added later if ever needed.
      critic_revisions:
        - source: sonnet
          severity: HIGH
          summary: files list must add internal/db/writequeue/queue.go — dedup window touches queue.go:83 not just op.go; ack {status,seq} is net-new on the channel-of-closures design.
        - source: haiku
          severity: HIGH
          summary: Added op_format_version to the envelope to close the daemon/op version-skew gap; unknown version now errors instead of mis-applying.
        - source: haiku
          severity: LOW
          summary: Dedup window must be bounded and durable — in-memory-only LRU leaks/loses state on restart; now backed by a durable last-applied marker (slice 3).
      decisions_notes: |
        **Trigger:** WriterClient.Submit over a per-project Unix socket at .wipnote/<sock>.
        **State:** op applied through the existing writqueue (canonical-derived rows); dedup
          uses an in-memory LRU for the hot path backed by a durable last-applied marker so
          restart cannot double-apply (resolves the version-skew/restart critic findings).
        **Payload:** {op_format_version, op_id, op_type, payload} -> ack {status: applied|duplicate|error, seq}.
        **Versioning:** op_format_version gates compatibility; a newer envelope hitting an older
          daemon errors loudly rather than corrupting derived rows.
        **Idempotency:** client-supplied op_id (hash of source event); dedup drops retries and
          spool replays uniformly. Monotonic seq lets SSE consumers resume.
        **Two-tier/coordinator-ready:** envelope carries project_id; the per-project socket path + O_EXCL lease are published to a discoverable registry so a future global coordinator (trk-cb80b7da, graduated serve_global) can supervise/route without changing the wire protocol; the per-project writer stays the sole write authority for its DB (failure isolation).
        **Rejected:** loopback HTTP submit (heavier, port allocation, less local-first);
          idempotent-by-construction-only ops (too restrictive for the mutation set);
          source-offset checkpoints alone (works for NDJSON ops, not for CLI mutations).
    - id: slice-2
      num: 2
      title: 'Daemon lifecycle: headless writer-only serve_child, on-demand auto-spawn, single-owner lease'
      what: |
        Graduate serve_child into an on-demand writer daemon. FIRST build a headless
        writer-only mode in serve_child: today serve_child always binds HTTP
        (serve_child.go: only a --port flag) — add a mode/flag that skips HTTP setup
        and runs only the socket listener + writqueue. The existing spawn path
        (os.Executable + exec.Command via the supervisor, serve.go:204) couples the
        child to an HTTP handshake (child prints port, parent scans stdout); the
        headless path must break that handshake cleanly (signal readiness via socket
        dial, not stdout port). A writer discovers the socket; if absent/stale it
        auto-spawns the headless daemon and blocks until ready (bounded readiness
        wait). Enforce single-owner via an O_EXCL PID/lease file so two writers
        racing to spawn converge on one daemon (loser dials the winner). Idle-timeout
        shutdown is guarded by a connect-grace so a writer dialing during shutdown
        re-spawns on a stale PID rather than failing.
      why: |
        For the daemon to be the canonical writer with no config flag (locked
        decision), ANY writer must be able to guarantee a daemon exists. Auto-spawn
        makes "is the daemon up?" a non-question. The lease prevents the
        multi-process double-spawn race the current intentionalCLIMutation paths
        would otherwise create.
      files:
        - internal/daemon/spawn.go
        - internal/daemon/lease.go
        - cmd/wipnote/serve_child.go
        - cmd/wipnote/serve.go
        - cmd/wipnote/serve_global.go
      deps:
        - 1
      done_when:
        - serve_child supports a headless writer-only mode (socket listener + writqueue, no HTTP listener) selectable by flag
        - A writer with no running daemon auto-spawns the headless daemon and submits successfully within a bounded readiness timeout
        - Two writers racing to spawn result in exactly one daemon, verified by lease-holder count (O_EXCL), with the loser dialing it
        - A writer dialing during idle-shutdown re-spawns on the stale PID instead of failing; the daemon never leaves an orphaned socket/lease
      effort: L
      risk: High
      tests: |
        Integration: TestHeadlessMode_NoHTTP — headless serve_child binds socket, never opens the HTTP port.
        Integration: TestAutoSpawn_FromColdStart — no daemon -> writer spawns -> op applied.
        Integration: TestSpawnRace_SingleOwner — N concurrent writers -> exactly one lease holder, N acks.
        Unit: TestLease_StaleTakeover — stale PID/lease reclaimed via O_EXCL, not deadlocked.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-process
          text: Standalone daemon process vs graduate serve_child?
          answer: Graduate serve_child — it already owns the writqueue and serve_global is already the doorway. Add a headless writer-only mode and auto-spawn it on demand. Least new code, single lifecycle.
      critic_revisions:
        - source: sonnet
          severity: DANGER
          summary: 'serve_child has NO headless writer-only mode today (serve_child.go: only --port, always HTTP) — building it is now explicit scope; effort raised M->L. Spawn handshake (serve.go:204 stdout-port scan) must be broken cleanly.'
        - source: sonnet
          severity: DANGER
          summary: No PID/lease mechanism exists anywhere today (internal/daemon/lease.go greenfield); single-owner requires O_EXCL atomic create — now specified.
        - source: haiku
          severity: HIGH
          summary: Idle-shutdown can race a connecting writer; readiness timeout value and a connect-grace re-spawn rule are now specified.
      decisions_notes: |
        **Trigger:** writer dials socket; on ECONNREFUSED/missing, acquire O_EXCL spawn lease and fork headless serve_child.
        **State:** O_EXCL PID + lease file in .wipnote/; readiness = first successful socket dial after lease validation (NOT stdout port scan).
        **Payload:** none new — reuses slice-1 envelope once connected.
        **Readiness/shutdown:** bounded readiness wait (a small constant, e.g. ~2s, with backoff) so a writer never hangs; idle-timeout shutdown guarded by a connect-grace window so a concurrent dial re-spawns rather than racing a closing listener.
        **Two-tier/coordinator-ready:** the headless writer is spawnable/supervisable by EITHER a local writer (auto-spawn) OR the future global coordinator (trk-cb80b7da); the O_EXCL lease + socket registry is the coordinator discovery/attach point; the coordinator supervises, it never takes the per-DB write lock.
        **Rejected:** standalone always-on `wipnote daemon` process (second lifecycle, larger build) — graduating serve_child reuses the existing writqueue + doorway with least new code; library-mode opportunistic leadership (trickiest handoff semantics).
    - id: slice-3
      num: 3
      title: Spool last-resort fallback + durable drain-on-start with persistent dedup
      what: |
        Add the last-resort path for the rare case where auto-spawn itself fails
        (e.g. a hook in a sandbox that cannot fork). The writer writes the canonical
        artifact first, then appends the write-op envelope to an append-only spool
        under .wipnote/spool/ using atomic-append + fsync + a per-record length/CRC
        framing so a crash mid-write leaves a truncatable (not corrupting) tail. On
        next start the daemon drains the spool in order, submitting each op through
        the durable dedup marker (slice 1) so replay is safe and convergent even if
        a crash occurred after apply but before spool-entry removal. A corrupt tail
        record is logged as an anomaly (slice 14) and truncated, never blocking the
        drain. Spool entries are removed only after an applied/duplicate ack.
      why: |
        The locked decision is "auto-spawn primary, spool only as last resort." The
        canonical .html is always the source of truth, so a writer must never block
        or lose a mutation just because it could not reach/start the daemon. The
        spool guarantees the derived index eventually converges without making the
        daemon a hard dependency (research doc, absolute-availability ethos).
      files:
        - internal/daemon/spool.go
        - internal/daemon/client.go
        - cmd/wipnote/serve_child.go
      deps:
        - 1
        - 2
      done_when:
        - When auto-spawn fails, the canonical artifact is written and the op is appended to the spool with atomic-append + fsync + CRC framing
        - On daemon start the spool is drained in order and the derived index converges to canonical
        - An op applied before a crash but not yet removed from the spool is NOT double-applied after restart (durable dedup marker)
        - A corrupt/partial trailing spool record is truncated and recorded as an anomaly, not allowed to block the drain
      effort: M
      risk: Med
      tests: |
        Integration: TestSpool_DrainConverges — force spawn failure, spool op, start daemon, assert index matches canonical.
        Unit: TestSpool_ReplayIdempotent — apply, simulate crash before removal, drain again -> single applied row.
        Unit: TestSpool_CorruptTailTruncated — append a torn record -> drain truncates + flags anomaly, earlier records still applied.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-fallback
          text: Spool always, or only when auto-spawn fails?
          answer: Only when auto-spawn fails. Auto-spawn is primary; spool is the belt-and-suspenders last resort for sandboxes that can't fork. Canonical .html is written first regardless.
      critic_revisions:
        - source: haiku
          severity: DANGER
          summary: Spool durability was unspecified — no fsync/atomic-append/corruption strategy; now atomic-append + fsync + per-record CRC with corrupt-tail truncation.
        - source: sonnet
          severity: HIGH
          summary: In-memory dedup LRU does not survive a crash -> spooled op could double-apply; dedup is now backed by a durable last-applied marker shared with slice 1.
      decisions_notes: |
        **Trigger:** spool append happens ONLY on auto-spawn failure (last resort), not on every write.
        **State:** append-only spool files in .wipnote/spool/ with length+CRC framing and fsync; canonical .html written before spooling; a durable last-applied marker (shared with slice 1) is the dedup source of truth across restarts.
        **Payload:** the slice-1 versioned envelope (with op_id) is what gets spooled and later submitted.
        **Durability:** atomic-append + fsync + per-record CRC so a crash mid-write yields a truncatable tail; corrupt tail -> anomaly + truncate, never a permanent drain block.
        **Rejected:** spool-always (Stage-2 default) — superseded by auto-spawn-primary; direct-DB-with-retry fallback — reintroduces the multi-writer contention this plan removes; in-memory-only dedup — loses state on restart (double-apply risk).
    - id: slice-4
      num: 4
      title: Route hook writes through the daemon (dbgate cutover)
      what: |
        Cut internal/hooks/dbgate.go over to the WriterClient: OpenHookDB (122) /
        SubmitDerivedOp (151) build a versioned write-op envelope (stable op_id from
        the hook event) and submit via the socket, auto-spawning the daemon if needed
        and falling back to canonical-write+spool only if spawn fails. Plumb a stable
        per-event seq/offset into the dbgate call sites so op_id = hash(sessionID +
        event seq) is reproducible across hook retries (this seq is not currently
        threaded into dbgate — net-new plumbing). Remove the direct OpenHookDB
        writable path as the primary route and retire the in-subprocess RetryOnBusy
        synchronous write (185). Update cmd/wipnote/sqlite_write_boundary_test.go to
        reclassify dbgate.go:123 away from canonicalFirstHookFallback.
      why: |
        Hook subprocesses opening SQLite directly are the single largest source of
        SQLITE_BUSY contention. Routing them through the daemon removes that contention
        at the root while preserving canonical-first durability (research doc, Item 3).
      files:
        - internal/hooks/dbgate.go
        - cmd/wipnote/hook.go
        - cmd/wipnote/sqlite_write_boundary_test.go
      deps:
        - 2
        - 3
      done_when:
        - Hook-driven derived writes are applied via the daemon socket, not a direct SQLite handle
        - A hook whose spawn attempt fails still records canonically and spools the op
        - SubsystemHookWriter busy-counter (busy_counter.go:74) increments drop to zero under a concurrent-hook test
        - sqlite_write_boundary_test reclassifies dbgate.go:123 away from canonicalFirstHookFallback (primary direct path retired)
      effort: M
      risk: High
      tests: |
        Integration: TestHookWrite_ViaDaemon — fire hook, assert op applied through socket, no direct open.
        Integration: TestHookWrite_NoBusyUnderConcurrency — N concurrent hooks -> zero SubsystemHookWriter busy events.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-hook-opid
          text: How is a hook op_id derived so retries dedup?
          answer: Hash of (sessionID + per-event seq/offset). A re-fired hook produces the same op_id, so the dedup marker drops the duplicate. The per-event seq is net-new plumbing into the dbgate call sites.
      critic_revisions:
        - source: sonnet
          severity: HIGH
          summary: cmd/wipnote/sqlite_write_boundary_test.go must be in files + done_when — retiring the direct path requires reclassifying dbgate.go:123 or the boundary test fails.
        - source: sonnet
          severity: LOW
          summary: Per-event seq is not currently plumbed into dbgate call sites; op_id stability requires net-new plumbing — now acknowledged in scope/effort.
        - source: sonnet
          severity: SUCCESS
          summary: OpenHookDB(122)/SubmitDerivedOp(151)/RetryOnBusy(185)/FallbackCounts(69) all confirmed at stated signatures — anchors solid.
      decisions_notes: |
        **Trigger:** every PostToolUse/Session* hook derived write routes through WriterClient.
        **State:** unchanged target tables; the write path changes from direct-open to socket-submit; FallbackCounts (dbgate.go:69 — writerUnavailable/queueFull/timeout) stays as the spool-fallback observability surface.
        **Payload:** op_id = hash of the hook event (sessionID + per-event seq/offset) for natural dedup on hook retries; the per-event seq must be plumbed into dbgate (net-new).
        **Inventory:** the boundary test is updated in this slice so the single-owner invariant stays enforced.
        **Rejected:** keeping dbgate's direct OpenHookDB as primary — it is the single largest source of SQLITE_BUSY; it survives only via the spool last-resort, not as the default.
    - id: slice-5
      num: 5
      title: Route all 13 CLI mutation sites through the daemon (openDB cutover)
      what: |
        Convert ALL 13 intentionalCLIMutation write sites (per the boundary-test
        inventory) to submit write-ops through the WriterClient with the same
        auto-spawn-then-spool semantics. Canonical .html is written by the command
        first (source of truth); only the derived-index write is delegated. Reads
        stay on the read-only pool. Resolve the serve_child.go:100 case explicitly:
        that writable handle IS the daemon's own in-process writer once serve_child
        is the daemon — it is reclassified daemonRoutedWriterService, NOT migrated
        away (it is the owner, not a client). Update the boundary test accordingly.
      why: |
        The intentionalCLIMutation sites are the second contention source after
        hooks; until they route through the single owner, the daemon cannot guarantee
        a contention-free writer and the single-owner invariant is incomplete. The
        critic count is 13 sites across these files (not the "~10/4 files" the first
        draft implied).
      files:
        - cmd/wipnote/session.go
        - internal/workitem/project.go
        - cmd/wipnote/plan_yaml_cmds.go
        - cmd/wipnote/check_gate_support.go
        - cmd/wipnote/ingest_gemini.go
        - cmd/wipnote/plan_feedback_cmd.go
        - cmd/wipnote/plan_finalize_yaml.go
        - cmd/wipnote/plan_typed_sections.go
        - cmd/wipnote/plan_yaml_extras.go
        - cmd/wipnote/status.go
        - cmd/wipnote/sweep.go
        - cmd/wipnote/track.go
        - cmd/wipnote/sqlite_write_boundary_test.go
      deps:
        - 2
        - 3
      done_when:
        - Work-item complete, session start/end, plan mutations, status, sweep, track, and gemini-ingest mutations all apply via the daemon, not a direct writable handle
        - Running a CLI mutation concurrently with active serve reads and a hook burst surfaces zero SQLITE_BUSY
        - The boundary test shows zero intentionalCLIMutation sites remaining; serve_child.go:100 is reclassified daemonRoutedWriterService
      effort: L
      risk: High
      tests: |
        Integration: TestCLIComplete_ViaDaemon — `feature complete` applies through socket.
        Integration: TestConcurrentWriters_NoBusy — CLI mutation + serve + hook concurrently, zero busy.
        Update: cmd/wipnote/sqlite_write_boundary_test.go classifications (all 13 sites + serve_child.go:100).
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-canonical-order
          text: Does the CLI write canonical .html before or after the daemon op?
          answer: Canonical .html first (it is the source of truth), then submit the derived-index op. If the op is spooled, the index converges later; canonical is never at risk.
      critic_revisions:
        - source: sonnet
          severity: DANGER
          summary: First draft listed 4 files/'~10 sites' but the inventory has 13 intentionalCLIMutation sites across 11 files; unlisted sites would fail the done_when. All now enumerated.
        - source: sonnet
          severity: DANGER
          summary: serve_child.go:100 (the most load-bearing writable open) was unaddressed; resolved as the daemon's OWN writer -> reclassify daemonRoutedWriterService, not migrate.
      decisions_notes: |
        **Trigger:** CLI subcommands that mutate derived state submit via WriterClient instead of openDB.
        **State:** canonical .html still written by the command directly (source of truth); only the derived-index write is delegated.
        **Payload:** op_id = hash of (work-item id + mutation kind + monotonic command nonce).
        **serve_child.go:100:** the dashboard child's writable handle becomes the daemon's OWN writer (the daemon IS serve_child) — reclassified daemonRoutedWriterService, not migrated as a client; this closes the single-owner gap the critic flagged.
        **Scope:** all 13 inventory sites (session, workitem, plan_yaml_cmds, check_gate_support, ingest_gemini, plan_feedback_cmd, plan_finalize_yaml, plan_typed_sections, plan_yaml_extras x2, status, sweep, track).
        **Rejected:** leaving CLI on direct openDB — these sites are the second contention source; leaving them defeats the single-owner invariant.
    - id: slice-6
      num: 6
      title: Coordinate reindex through the daemon (close the checkpoint race, no self-deadlock)
      what: |
        Make `wipnote reindex` a daemon-coordinated operation. Today reindex resets
        .index-offset checkpoints (reindex_otel_events.go:46) and removes them
        (line 140) while a running indexer may be advancing them — an unsynchronized
        race (confirmed: no lock today). Route reindex through the daemon so
        checkpoint-reset and indexer-advance cannot interleave. Critically, reindex
        runs AS a daemon operation (submitted to / executed by the writqueue owner),
        not as an external process grabbing the same lease the daemon's consumer
        holds — this avoids self-deadlock. Spool drain and reindex both run inside
        the daemon's single write context, serialized by the consumer, never
        competing for a lock. Lease/coordination acquisition has a bounded timeout
        that returns a clear error rather than hanging. Preserve the foreground +
        TMPDIR-safety contract (never background reindex on volatile tmpfs).
      why: |
        Reindex resets .index-offset checkpoints while a live indexer may advance them —
        an unsynchronized race that can lose or duplicate offset progress. Serializing
        reindex inside the daemon's single write context closes a known correctness gap
        the single-owner model otherwise exposes, without introducing a reindex-vs-daemon
        self-deadlock.
      files:
        - cmd/wipnote/reindex.go
        - cmd/wipnote/reindex_otel_events.go
        - cmd/wipnote/lazy_reindex.go
        - internal/daemon/lease.go
      deps:
        - 2
      done_when:
        - Reindex executes inside the daemon write context (or as a queued daemon op) so checkpoint-reset and indexer-advance are serialized — never interleaved
        - A reindex concurrent with a live indexer produces a consistent index (no lost/duplicated offset advances)
        - Coordination acquisition has a bounded timeout and returns a clear error rather than hanging or self-deadlocking
        - Reindex remains a foreground command and honors the existing TMPDIR-safety contract
      effort: M
      risk: Med
      tests: |
        Integration: TestReindex_SerializedByDaemon — start indexer, trigger reindex, assert single consistent offset progression.
        Unit: TestReindex_AcquireTimeout — contended coordination returns an error within the timeout, no hang.
        Regression: reindex still runs foreground; no background-spawn of reindex.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-reindex-lease
          text: Route reindex fully through the daemon, or just a lock guard?
          answer: Route through the daemon AS a daemon op (executed by the writqueue owner). A bare lock guard closes the race but leaves reindex outside the single-owner model; an external lease-grab risks self-deadlock against the daemon's own consumer.
      critic_revisions:
        - source: haiku
          severity: DANGER
          summary: Reindex/daemon self-deadlock was unspecified — resolved by running reindex AS a daemon op (executed by the writqueue owner) rather than an external lease-grab; acquisition is bounded-timeout.
        - source: sonnet
          severity: SUCCESS
          summary: 'Confirmed: reindex_otel_events.go:46/140 resets+removes .index-offset with NO lock vs the indexer — the race is real; TMPDIR hazard relevance confirmed.'
      decisions_notes: |
        **Trigger:** `wipnote reindex` is executed by the daemon's writqueue owner (a daemon op), not by an external process competing for the writer lease.
        **State:** checkpoints (.index-offset) and the derived index — both mutated only by the single daemon consumer, so spool drain + reindex + normal ops are naturally serialized.
        **Deadlock resolution:** because reindex IS a daemon op rather than an external lease-grab, it never blocks on the lease the daemon's own consumer holds; acquisition for the daemon-spawn step is bounded-timeout with a clear error.
        **Hazard:** must stay foreground — backgrounding reindex on volatile tmpfs can brick the session (project memory: reindex tmpfs hazard).
        **Rejected:** minimal lock-guard only (refuse/wait) and external lease-grab (self-deadlock risk the critic flagged) — chosen route-through-daemon-as-op so reindex composes with the single-owner model.
    - id: slice-7
      num: 7
      title: Explicit rebuildable-derived contract + /api/db-health endpoint and panel
      what: |
