name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Complexity ratchet (new code only)
        # Gates cognitive/cyclomatic complexity and nesting depth on code
        # added or changed relative to main. Pre-existing violations are
        # tolerated (see .golangci.yml); this only blocks NEW complexity, so
        # the debt is paid down incrementally rather than in a big-bang
        # refactor. fetch-depth:0 is required for the merge-base diff.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.5.0
          args: --new-from-merge-base=origin/main
      - name: Test
        run: go test -short ./...
      - name: Acceptance harness (CI-safe, fake binaries)
        # Runs the small CI-safe subset of the parallel-launcher acceptance
        # harness (plan-1670cacd slice-10, feat-7835351a). Uses fake DB rows
        # and the existing API handlers — no real harness binaries, no network.
        # The larger stress harness (TestSQLiteContentionStress) is opt-in:
        #   go test -run TestSQLiteContentionStress -count=3 ./cmd/wipnote/
        # See docs/runbook/launcher-isolation.md for the full release gate.
        run: |
          export TMPDIR=/tmp
          go test -short -run 'TestParallelHarnessLineage|TestParallelHarness_MainStaysClean|TestMultiHarnessIngestion' ./cmd/wipnote/
