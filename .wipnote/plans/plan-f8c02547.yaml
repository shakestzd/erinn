meta:
    id: plan-f8c02547
    track_id: trk-a951e3c0
    title: 'Plans that read as maps: static SVG blocks, in-place critique, prose caps'
    description: ""
    created_at: ""
    status: draft
    schema_version: v4
    version: 2
design:
    problem: |
        Plan documents are not read. Measured over 45 plans and 282 slices: what,
        done_when, why and tests are 74.8% of all words; median plan is 9.3 minutes
        of reading and the worst is 27. Words per slice rose 77% while slices per
        plan fell 22% — plans are not getting structurally complex, individual
        slices are getting verbose, because critique appends instead of revising.

        The "visual" block catalog does not draw. 22 block instances are authored
        across the corpus (12 file-tree, 4 diagram, 4 data-model, 1 wireframe, 1
        tabs, 0 api-endpoint); they render as 34 instances because blocks are
        emitted by both blocks_zone and visual_overview_zone. Zero of either figure
        contain an svg or canvas element, by explicit design — plan/blocks/diagram.go
        states it is "deliberately Mermaid-free and uses pure HTML/CSS (no
        client-side layout engine, no SVG text-measurement)". file-tree has no
        indentation logic at all, so 3 files and 30 files render identically flat;
        diagram joins bordered divs with a Unicode arrow glyph rather than a drawn
        edge. The one component with real rendering machinery — the dependency graph
        — emits an EMPTY svg and is built client-side by d3 plus dagre-d3 from a
        display:none data island, so it is invisible in archived, offline and no-JS
        views.

        Block adoption is NOT the problem: blocks-first shipped 2026-06-21 and 43 of
        45 plans predate it; the single organic post-launch plan reached 8 of 8
        block coverage unenforced. The feature works as designed. The design
        produces text.
    goals:
        - 'Give the block catalog a real drawing primitive: static inline SVG generated in Go at render time.'
        - Make the dependency graph exist in the committed artifact, readable with no JavaScript.
        - 'Stop per-slice prose inflation at its source: critique revises in place, and `what` is capped.'
        - Close the default-tier block gap without breaking in-flight drafts or the 42 legacy plans.
        - 'Remove catalog dead weight: api-endpoint has never been used in 282 slices.'
    constraints:
        - No cgo, no external binary, no network fetch at render time. A pure-Go embedded dependency is acceptable where it removes custom-algorithm risk.
        - 'Rendered output must be self-contained: no external font, script, stylesheet or runtime fetch.'
        - Legacy plans re-render lazily on next mutation. The d3/dagre-d3 vendor assets stay on disk until the last legacy plan is migrated.
        - '`wipnote plan validate` must accept BOTH the legacy d3 format and the new inline-SVG format for the whole migration window.'
        - 'Must not break plan review: the feedback DOM contract (data-section, data-block-anchor, anchor scheme) is load-bearing.'
        - Plan HTML is the retrieval corpus for `wipnote relevant` (rg --type html) and `wipnote find plans`. Emitted labels must stay greppable as contiguous text.
    approved: false
    comment: ""
    research:
        - url: https://github.com/terrastruct/d2/blob/master/d2layouts/d2dagrelayout/layout.go
          claim: 'terrastruct/d2 does not port dagre to Go — it go:embeds dagre.js and executes it in a JS runtime. Verified: the directory contains dagre.js, setup.js, layout_embed.go and the code calls runner.RunString(dagreJS). Adopted as the model for slice 2.'
          accessed: "2026-08-07"
        - url: https://github.com/dop251/goja
          claim: Pure-Go ECMAScript interpreter with no cgo and no external binary — the candidate runtime for executing embedded dagre.js while preserving the no-cgo constraint.
          accessed: "2026-08-07"
        - url: https://pkg.go.dev/gonum.org/v1/gonum/graph/layout
          claim: gonum's only layout algorithms are EadesR2 (force-directed) and IsomapR2 (MDS). Neither is a layered/hierarchical DAG layout, so gonum cannot render dependency depth legibly. Rejected.
          accessed: "2026-08-06"
        - url: https://github.com/ajstarks/svgo
          claim: 'Verified: last push 2022-12-09 and the LICENSE file is literal Creative Commons Attribution 4.0 text. An attribution-encumbered license for what is fmt.Fprintf tag writing underneath. Rejected for SVG emission.'
          accessed: "2026-08-06"
        - url: https://github.com/goccy/go-graphviz
          claim: 'Verified: embeds Graphviz as WASM (no cgo, no system binary), v0.2.10 published 2025-11-29. A genuinely mature alternative, rejected only because its Graphviz-styled output needs full re-theming to match wipnote.'
          accessed: "2026-08-06"
slices:
    - id: slice-1
      num: 1
      title: SVG primitive package — emission helpers, arrowhead marker, deterministic text metrics
      what: |
        New plan/blocks/svg package: helpers emitting rect, text, line, path,
        group and a shared arrowhead marker def, plus exact label-width arithmetic
        from a monospace face.
      why: |
        Every drawing slice needs these primitives. Slices 2 and 3 both draw
        arrowed edges, so the marker def must live here or it gets implemented
        twice, against the repo's no-duplication rule.
      files:
        - plan/blocks/svg/svg.go
        - plan/blocks/svg/metrics.go
        - plan/blocks/svg/svg_test.go
      deps: []
      done_when:
        - Helpers emit well-formed SVG with all label text passed through html.EscapeString.
        - A single reusable arrowhead marker def is exported, consumed by both the graph and diagram renderers.
        - Labels emit as single contiguous <text> nodes, never per-character tspans, so ripgrep phrase matching over plan HTML still resolves.
        - Label width is computed as charCount times a fixed advance, exact for the chosen monospace family.
        - Output contains no external font, script, stylesheet or network reference.
        - Colors are emitted as CSS custom properties so both themes work without duplicate markup.
      effort: M
      risk: Low
      tests: |
        Unit: TestEmit_EscapesLabels — angle brackets and ampersands render as
        entities, not raw markup.
        Unit: TestEmit_GreppableLabels — a multi-word label appears as one
        contiguous text node; asserts no per-character tspan splitting.
        Unit: TestEmit_ArrowheadMarkerShared — the marker def is emitted once and
        referenced by id.
        Unit: TestMeasure_MonospaceExact — width of an n-character label equals n
        times the advance constant.
        Unit: TestEmit_ThemeVariables — emitted fills and strokes reference CSS
        custom properties, not literal hex.
        Unit: TestEmit_NoExternalRefs — golden output contains no http, @import or
        <script>.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://github.com/ajstarks/svgo
          claim: 'Rejected: last push 2022-12-09, CC-BY-4.0 license verified by reading the LICENSE file directly, and implemented as fmt.Fprintf tag writing.'
          accessed: "2026-08-06"
        - url: https://pkg.go.dev/golang.org/x/image/font/basicfont
          claim: Self-contained public-domain bitmap face with Advance exactly 7 — the fallback if proportional measurement is ever needed. Not required while labels are monospace.
          accessed: "2026-08-06"
      questions:
        - id: q-escape
          text: Should label text be escaped in the primitive layer or by callers?
          answer: In the primitive layer. Slice titles are author-controlled prose and have already caused a real bug — bug-37801e41, 'Plan renderer strips literal angle-brackets'. Escaping once at the boundary prevents every caller from having to remember.
        - id: q-greppable
          text: Does emitting SVG text risk the retrieval corpus?
          answer: Yes, and it is the crux of this slice. `wipnote relevant` runs rg --type html over plan HTML and `wipnote find plans` parses the DOM. Per-character tspan positioning would break phrase matching for all 42 plans silently. Contiguous text nodes are therefore a hard requirement, tested.
      critic_revisions:
        - source: claude-design
          severity: HIGH
          summary: Retrieval-corpus parseability was declared load-bearing in constraints but had no acceptance criteria in any slice. Added contiguous-<text> requirement plus TestEmit_GreppableLabels.
        - source: claude-design
          severity: MED
          summary: Arrowhead primitive was absent while slices 2 and 3 both require drawn arrowheads — duplication risk against the repo's no-duplication rule. Added a shared marker def here.
        - source: claude-feasibility
          severity: LOW
          summary: done_when for theme CSS custom properties had no named test. Added TestEmit_ThemeVariables.
      decisions_notes: |
        **Trigger:** called by the layout and block renderers at plan render time,
        never at request time — output is baked into the committed HTML.
        **State:** none. Pure functions from data to markup.
        **Payload:** SVG element fragments written to an io.Writer, composed by callers.
        **Rejected:** ajstarks/svgo — unmaintained since 2022-12-09 and CC-BY-4.0,
        an attribution-encumbered license for what is fmt.Fprintf underneath.
        twpayne/go-svg — actively maintained but only maps structs to XML, which
        text/template already does. Per-character tspan positioning — rejected
        explicitly because it would silently break `wipnote relevant`, which greps
        the rendered HTML.
      blocks:
        - type: file-tree
          title: Files this slice creates
          entries:
            - plan/blocks/svg/svg.go
            - plan/blocks/svg/metrics.go
            - plan/blocks/svg/svg_test.go
        - type: diagram
          title: Render path once primitives exist
          fields:
            direction: lr
          entries:
            - slice data (Go structs)
            - 'layout: assign coordinates'
            - 'svg primitives: emit elements'
            - inline <svg> in committed HTML
    - id: slice-2
      feature_id: feat-f8644765
      num: 2
      title: Static dependency graph via embedded dagre.js, with dual-format validator support
      what: |
        Embed dagre.js and run it in a pure-Go JS interpreter at render time to
        get node coordinates, then emit a static inline SVG. Teach plan validate
        to accept both formats during migration.
      why: |
        The dependency graph is an empty svg in every committed plan. Corpus deps
        skip ranks — plan-1670cacd routes an edge across two intervening ranks —
        so a hand-rolled layout would need the virtual-node insertion dagre
        already does correctly.
      files:
        - plan/blocks/svg/layout.go
        - plan/blocks/svg/layout_test.go
        - plan/plantmpl/dependency_graph.go
        - plan/plantmpl/templates/dependency_graph.gohtml
        - plan/plantmpl/templates/plan_page.gohtml
        - plan/plantmpl/builder_test.go
        - cmd/wipnote/plan_validate.go
        - cmd/wipnote/plan_validate_test.go
      deps:
        - 1
      done_when:
        - A committed plan HTML contains a drawn dependency graph with no JavaScript executed.
        - The real rank-skipping edge from plan-1670cacd (slice 1 to slice 8, crossing two intervening ranks) routes clear of their bounding boxes.
        - dagre.js is compiled once via goja.Compile and reused; it is not re-parsed per render.
        - '`wipnote plan validate` passes on BOTH a legacy d3-format plan and a new inline-SVG plan.'
        - The d3 and dagre-d3 vendor assets remain on disk; only the new template stops referencing them.
        - Graph node and edge markup preserves the existing data-section and anchor scheme so review still resolves.
        - A known slice title in the graph is still found by ripgrep over the rendered file.
      effort: L
      risk: Med
      tests: |
        Unit: TestLayout_DagreCoordinates — a known DAG yields stable coordinates
        from the embedded engine.
        Unit: TestLayout_MultiRankEdge — the plan-1670cacd rank-skipping case
        routes clear of intervening node bounding boxes.
        Bench: BenchmarkLayout_16Nodes — guards the ~106ms measured ceiling at
        the corpus maximum.
        Golden: TestRenderGraph_Static — rendered SVG matches a golden file and
        contains no <script>.
        Regression: TestPlanValidate_DualFormat — legacy d3 plans and new SVG plans
        both validate; replaces the current assertion that CDN tags must exist.
        Regression: TestPlanPageRenderCRISPIStructure — updated so it no longer
        requires d3.v7.min.js and dagre-d3 substrings.
        Regression: TestGraph_Greppable — rg finds a slice title in the output.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://github.com/terrastruct/d2/blob/master/d2layouts/d2dagrelayout/layout.go
          claim: 'Verified: d2 go:embeds dagre.js alongside setup.js and executes it via a JS runner rather than porting the algorithm. Directly adopted as this slice''s approach.'
          accessed: "2026-08-07"
        - url: https://github.com/dop251/goja
          claim: Pure-Go ECMAScript interpreter, no cgo, no external binary — satisfies the no-cgo constraint while running embedded dagre.js. Runtime suitability to be confirmed in implementation.
          accessed: "2026-08-07"
      execution_status: promoted
      questions:
        - id: q-runtime
          text: Is goja confirmed able to execute dagre.js unmodified?
          answer: 'RESOLVED — yes, spiked and confirmed. d2''s lib/jsrunner/goja.go IS backed by dop251/goja on the non-wasm build tag, so this is direct precedent rather than a similar architecture. The unmodified 283KB dagre.js bundle runs with only d2''s 7-line setup.js plus a console shim — no window or document scaffolding. Verified against plan-1670cacd''s real graph with a programmatic bbox-overlap check. Timings: one-time goja.Compile 10.9ms, fresh runtime plus precompiled program 1.3-2ms, layout 16.6ms at 5 nodes and 106ms at 16 (the corpus maximum). CGO_ENABLED=0 builds clean; 4 transitive deps.'
        - id: q-legacy
          text: What happens to the 42 legacy plans during migration?
          answer: They keep the d3 format and keep working. Vendor assets stay on disk and the validator accepts both formats until the last plan is re-rendered lazily. Deleting the vendor files before migration completes would leave broken script tags in every un-migrated plan.
      critic_revisions:
        - source: claude-feasibility
          severity: HIGH
          summary: cmd/wipnote/plan_validate.go:352-359 hard-fails when d3/dagre-d3 CDN tags are absent, with plan_validate_test.go:164-179 asserting it, and plan/plantmpl/builder_test.go:190-196 asserts they must be present. None were in scope — the original slice would have broken every `wipnote plan validate` call. All three added.
        - source: claude-feasibility
          severity: HIGH
          summary: plan/plantmpl/templates/dependency_graph.gohtml — the file actually containing the empty <svg> and display:none data island — was omitted from the file list. Added.
        - source: claude-feasibility
          severity: HIGH
          summary: Corpus scan shows multi-rank-skipping deps are common, not hypothetical (plan-1670cacd slice 8 depends on slice 1, a seven-rank gap). Hand-rolled Sugiyama needed dummy-node insertion absent from the spec. Approach changed to embedded dagre.js, matching d2's own precedent.
        - source: claude-design
          severity: HIGH
          summary: 'Vendor-asset handling was unstated: deleting d3/dagre-d3 while legacy plans re-render lazily would leave broken script tags in every un-migrated plan. Constraint added to retain assets until migration completes.'
        - source: claude-design
          severity: MED
          summary: No criterion protected the data-section/anchor scheme despite the DOM contract being declared load-bearing, unlike slice 3 which had one. Added.
        - source: claude-design
          severity: MED
          summary: The 16-node layout ceiling was the only quantitative claim in the plan not traceable to a corpus measurement. Removed — dagre handles the real distribution without asserting a bound.
      decisions_notes: |
        **Trigger:** invoked during renderPlanCore, once per plan render.
        **State:** none beyond the slice graph already in the YAML.
        **Payload:** an inline <svg> embedded in the plan page.
        **Rejected:** hand-rolled Sugiyama layout — the original plan. Rejected on
        critic evidence: multi-rank-skipping edges are common in the real corpus,
        so correct layout requires dummy-node insertion, crossing reduction and
        edge routing built from scratch, on the highest-risk slice, with no
        battle-testing. d2 solves the identical problem by embedding dagre.js
        rather than porting it. gonum/graph/layout — only force-directed and MDS,
        neither conveys dependency depth. goccy/go-graphviz — mature and cgo-free
        via WASM, but its Graphviz-styled output needs full re-theming.
        **Note:** cmd/wipnote/plan_validate.go currently HARD-FAILS when d3 and
        dagre-d3 CDN tags are absent (lines 352-359, with a test asserting it), and
        plan/plantmpl/builder_test.go asserts those substrings must be present.
        Both are in scope here; omitting them would break every plan validate call.
        **Spike outcome (GO):** precompile dagre.js once with goja.Compile behind a
        sync.Once and spin a cheap runtime per render. Batch result extraction into
        two Array.map calls rather than copying d2's per-node JSON.stringify
        round-trips, which are wasteful at scale. Scope single-render graphs to one
        plan or track: measured cost is superlinear (~O(n^1.3), goja has no JIT)
        and crosses one second around 100 nodes — irrelevant at the corpus maximum
        of 16, but disqualifying for a whole-project mega-graph.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - plan/blocks/svg/layout.go
            - plan/blocks/svg/layout_test.go
            - plan/plantmpl/dependency_graph.go
            - plan/plantmpl/templates/dependency_graph.gohtml
            - plan/plantmpl/templates/plan_page.gohtml
            - plan/plantmpl/builder_test.go
            - cmd/wipnote/plan_validate.go
            - cmd/wipnote/plan_validate_test.go
        - type: diagram
          title: Render path
          fields:
            direction: lr
          entries:
            - slice deps -> graph JSON
            - goja runs embedded dagre.js
            - coordinates returned
            - svg primitives emit static <svg>
    - id: slice-3
      num: 3
      title: Real file-tree indentation and drawn diagram edges
      what: |
        Rewrite the FileTree renderer to indent by path depth with connector
        lines, and the Diagram renderer to draw real edges using slice 1's shared
        arrowhead marker.
      why: |
        These are the two most-used block types (12 and 4 authored instances).
        file-tree has no indentation logic anywhere, so hierarchy is invisible;
        diagram uses a Unicode arrow glyph instead of a drawn line.
      files:
        - plan/blocks/blocks.go
        - plan/blocks/diagram.go
        - plan/blocks/templates/file_tree.gohtml
        - plan/blocks/blocks_test.go
      deps:
        - 1
      done_when:
        - A file-tree of nested paths renders with visible depth; a flat list and a nested list no longer look identical.
        - Diagram edges are drawn paths with arrowheads from slice 1's shared marker, not text glyphs.
        - Both renderers keep their existing block-anchor id scheme so annotations still resolve.
      effort: M
      risk: Low
      tests: |
        Unit: TestFileTree_Indents — paths at differing depths receive differing x
        offsets; a previously-flat corpus sample now varies.
        Unit: TestDiagram_DrawsEdges — output contains path elements referencing
        the shared marker and no arrow glyph characters.
        Regression: TestBlockAnchors_Unchanged — anchor ids match the
        slice-N-block-type-idx scheme byte for byte.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://github.com/xlab/treeprint
          claim: 'Verified: an ASCII/Unicode box-drawing tree composer for terminal output, not coordinate-based SVG layout — not reusable for this renderer.'
          accessed: "2026-08-06"
      critic_revisions:
        - source: claude-feasibility
          severity: HIGH
          summary: plan/blocks/file_tree.go does not exist anywhere in the tree — FileTree is defined at plan/blocks/blocks.go:81. Path corrected.
      decisions_notes: |
        **Trigger:** block render time, per block instance.
        **State:** none — derived entirely from the block's entries.
        **Payload:** inline SVG replacing the current ul and div markup.
        **Rejected:** xlab/treeprint and similar — they target character-based
        terminal output, not coordinate-based SVG layout. Keeping the Unicode
        arrow — rejected because it is precisely what makes diagram blocks read as
        text in a box.
        **Note:** FileTree and APIEndpoint are defined in plan/blocks/blocks.go
        (lines 81 and 59), NOT in standalone file_tree.go / api_endpoint.go files.
        Those paths do not exist.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - plan/blocks/blocks.go
            - plan/blocks/diagram.go
            - plan/blocks/templates/file_tree.gohtml
            - plan/blocks/blocks_test.go
    - id: slice-4
      num: 4
      title: Critique revises slices in place instead of appending
      what: |
        Change the critique write path so revisions rewrite the slice fields and
        stop appending critic_revisions entries. Prior wording stays recoverable
        through git.
      why: |
        Appending is the measured mechanism behind slice inflation: words per slice
        rose 77% while slices per plan fell, with the worst slices reaching 1,306
        words from what plus questions plus critic_revisions stacked together.
      files:
        - cmd/wipnote/plan_critique.go
        - plan/planyaml/schema.go
        - cmd/wipnote/plan_critique_test.go
      deps: []
      done_when:
        - A critique pass that changes a slice leaves exactly one version of each prose field.
        - '`wipnote history <plan-id>` still surfaces the superseded wording from git.'
        - Existing plans carrying critic_revisions still load and render without error.
      effort: M
      risk: Med
      tests: |
        Unit: TestCritique_RewritesInPlace — after two critique rounds the slice
        holds one what value and no accumulated revisions.
        Compat: TestLoad_LegacyCriticRevisions — a plan with populated
        critic_revisions parses and renders unchanged. This plan is itself the
        first live fixture, having carried critic_revisions from its own pass.
        Integration: TestHistory_SurfacesSuperseded — `wipnote history` on a
        rewritten plan shows the prior wording from git.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Internal write-path and schema change against wipnote's own YAML; no external library, standard or API applies.
      critic_revisions:
        - source: claude-design
          severity: LOW
          summary: 'Ambiguity over whether `what` already rewrites in place or also accumulates determined whether slices 4 and 5 truly do not interact. Scope clarification added: only critic_revisions accumulates today.'
        - source: claude-feasibility
          severity: LOW
          summary: done_when for `wipnote history` surfacing superseded wording had no corresponding test. Added TestHistory_SurfacesSuperseded.
      decisions_notes: |
        **Trigger:** the critique write path, after a critic proposes a change.
        **State:** the slice YAML itself; superseded wording lives only in git.
        **Payload:** a rewritten slice, not an appended revision record.
        **Rejected:** a superseded field inside the YAML — keeps the weight in the
        document and in anything reading it, including spec generate.
        Renderer-only collapsing — the YAML would keep growing and specs would
        still inherit the bloat.
        **Scope clarification:** today only critic_revisions accumulates; `what` is
        already rewritten in place. This slice therefore does not interact with
        slice 5's cap on `what`.
        **Bootstrapping note:** this plan will itself carry critic_revisions from
        its own critique pass, making it the first real fixture for the compat test.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - cmd/wipnote/plan_critique.go
            - plan/planyaml/schema.go
            - cmd/wipnote/plan_critique_test.go
        - type: data-model
          title: PlanSlice field change
          fields:
            name: PlanSlice
          rows:
            - name: what
              type: rewritten in place by critique
            - name: critic_revisions
              type: deprecated — read for compat, never appended
    - id: slice-5
      num: 5
      title: Prose caps in schema validation, with author-facing guidance
      what: |
        Add word-count validation to plan slices: `what` fails past a
        corpus-derived threshold, while why, done_when and tests emit advisories.
        Update the plan skill so authors learn the cap before hitting it.
      why: |
        `what` alone is 33% of all corpus words at a median of 96 per slice. The
        plan should be the map; `wipnote spec generate` already exists to hold the
        territory.
      files:
        - plan/planyaml/validate.go
        - plan/planyaml/validate_test.go
        - plugin/skills/plan/SKILL.md
      deps: []
      done_when:
        - The hard cap value is derived from the measured corpus distribution and documented with the percentile it targets, not chosen as a round number.
        - A slice whose `what` exceeds the cap fails `wipnote plan validate-yaml` with a message naming the field and count.
        - Advisory fields report over-length without failing the command.
        - Finalized plans are exempt so the 42 legacy plans do not retroactively fail.
        - plugin/skills/plan/SKILL.md states the cap so authors see it during the interview.
      effort: S
      risk: Med
      tests: |
        Unit: TestValidate_WhatCapFails — a 96-word what (the corpus median) fails
        with a count in the message.
        Unit: TestValidate_AdvisoryDoesNotFail — an over-length why produces a
        warning and a zero exit.
        Unit: TestValidate_FinalizedExempt — a finalized legacy plan with long
        prose still validates.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Validation rules over wipnote's own schema; the threshold is derived from wipnote's own corpus, so no external standard or dependency applies.
      critic_revisions:
        - source: claude-feasibility
          severity: MED
          summary: The ~40/~60 word thresholds were asserted round numbers with no corpus or readability basis — the weakest-grounded figures in an otherwise rigorously cited plan. Replaced with a done_when requiring the cap be derived from the measured distribution and its target percentile recorded.
        - source: claude-design
          severity: LOW
          summary: plugin/skills/plan/SKILL.md was not updated, so authors would hit a hard validation failure with no prior warning during the interview. Added to scope.
      decisions_notes: |
        **Trigger:** `wipnote plan validate-yaml`, and the finalize path.
        **State:** none — pure validation over loaded YAML.
        **Payload:** a validation error naming field and word count, or an advisory.
        **Rejected:** hard caps on every prose field — would fail in-flight drafts
        and fight the author mid-interview. Advisory-only everywhere — rejected on
        measured evidence: ValidateBlockAdvisories is already advisory-only and the
        default complexity tier sits at 0% block usage across 204 slices, so a
        non-blocking signal demonstrably does not bind.
        **Open on the threshold:** the earlier draft asserted ~40 words with no
        basis. The cap must instead be computed from the corpus so it fails the
        long tail rather than the median, and the chosen percentile recorded.
        **File overlap:** shares plan/planyaml/validate.go with slice 7. No logical
        dependency, but do not execute them concurrently without file-overlap
        partitioning.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - plan/planyaml/validate.go
            - plan/planyaml/validate_test.go
            - plugin/skills/plan/SKILL.md
        - type: data-model
          title: Cap table
          fields:
            name: ProseCaps
          rows:
            - name: what
              type: hard fail above corpus-derived threshold
            - name: why
              type: advisory
            - name: done_when
              type: advisory
            - name: tests
              type: advisory
    - id: slice-6
      num: 6
      title: Harden the default-tier block gate, with a legacy exemption
      what: |
        Make the block advisory blocking for slices whose complexity resolves to
        standard, exempting finalized plans so the existing corpus does not
        retroactively fail.
      why: |
        Unset complexity defaults to standard and covers 204 of 282 slices with 0%
        block usage — the gap where the regression will appear once volume picks
        up.
      files:
        - plan/planyaml/validate.go
        - plan/planyaml/validate_test.go
        - plugin/skills/plan/SKILL.md
      deps: []
      done_when:
        - A standard or complex slice with no blocks fails validation unless it carries an explicit skip reason.
        - Finalized plans are exempt, so none of the 204 existing block-free slices retroactively fail.
        - The two existing block-carrying plans still validate and render.
      effort: S
      risk: Med
      tests: |
        Unit: TestValidate_BlocksRequiredAtDefaultTier — a draft slice with unset
        complexity and no blocks fails.
        Unit: TestValidate_SkipReasonAccepted — the same slice passes when it
        records why blocks were skipped.
        Regression: TestValidate_LegacyCorpusExempt — a finalized plan from the
        existing 204-slice population still validates.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Internal validation policy against wipnote's own schema; no external dependency, standard or API applies.
      critic_revisions:
        - source: claude-design
          severity: HIGH
          summary: No legacy exemption here, unlike the near-identical slice 5 — as written, the next validate run would fail all 204 existing block-free slices. Exemption added.
        - source: claude-design
          severity: MED
          summary: Bundled gate hardening with api-endpoint removal, forcing one approval for two unrelated policies. Split into slices 6 and 7.
      decisions_notes: |
        **Trigger:** `wipnote plan validate-yaml` and finalize.
        **State:** none — validation over loaded YAML.
        **Payload:** a blocking error naming the slice, or a pass when a skip
        reason is recorded.
        **Rejected:** leaving the advisory non-blocking — measured to produce 0%
        uptake at the default tier. Removing the skip escape hatch — rejected
        because the blocks-first skill explicitly allows noting a skip when a slice
        is genuinely underspecified, and forcing invention would violate the
        grounding rule.
        **Critic fix:** the earlier draft had no legacy exemption here while slice
        5 had one, which would have failed all 204 existing block-free slices on
        the next validate run.
        **File overlap:** shares validate.go with slice 5 and SKILL.md with slice 5.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - plan/planyaml/validate.go
            - plan/planyaml/validate_test.go
            - plugin/skills/plan/SKILL.md
    - id: slice-7
      num: 7
      title: Drop the never-used api-endpoint block type
      what: |
        Remove APIEndpoint from the block catalog, schema and renderers, including
        its template and tests.
      why: |
        Zero instances authored across 282 slices. Carrying a catalog entry nobody
        uses costs interview attention and validator surface for no return.
      files:
        - plan/planyaml/schema.go
        - plan/blocks/blocks.go
        - plan/blocks/templates/api_endpoint.gohtml
        - plan/blocks/blocks_test.go
      deps: []
      done_when:
        - api-endpoint no longer appears in `wipnote plan blocks` output or its JSON form.
        - The api_endpoint template is deleted and its tests removed or repurposed.
        - No existing plan fails to load, since no plan authors the type.
      effort: S
      risk: Low
      tests: |
        Catalog: TestBlockCatalog_NoAPIEndpoint — the type is absent from the
        catalog and from --json output.
        Regression: existing TestBlocks_APIEndpoint and
        TestBlocks_APIEndpoint_NoParams in plan/blocks/blocks_test.go are removed
        alongside the type.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Catalog pruning of wipnote's own block vocabulary; no external dependency, standard or API applies.
      critic_revisions:
        - source: claude-feasibility
          severity: HIGH
          summary: plan/blocks/api_endpoint.go does not exist — APIEndpoint is defined at plan/blocks/blocks.go:59. The template plan/blocks/templates/api_endpoint.gohtml and the tests at plan/blocks/blocks_test.go:58-89 also had to be removed and were missing from scope. All corrected.
      decisions_notes: |
        **Trigger:** catalog definition load and block render dispatch.
        **State:** none.
        **Payload:** a smaller catalog; unknown type errors if ever authored.
        **Rejected:** keeping api-endpoint for future use — YAGNI, and it is
        restorable from git if a real need appears. Bundling this with the gate
        hardening — split out on critic advice so a reviewer can approve the policy
        change and the catalog pruning independently.
        **Note:** APIEndpoint is defined in plan/blocks/blocks.go:59, not in a
        standalone api_endpoint.go, which does not exist.
      blocks:
        - type: file-tree
          title: Files this slice touches
          entries:
            - plan/planyaml/schema.go
            - plan/blocks/blocks.go
            - plan/blocks/templates/api_endpoint.gohtml
            - plan/blocks/blocks_test.go
questions: []
critique:
    reviewed_at: "2026-08-07"
    reviewers:
        - 'claude-design (role: design critic; runner: Claude Code subagent, this session)'
        - 'claude-feasibility (role: feasibility critic; runner: Claude Code subagent, this session; ran live repo checks and GitHub API verification)'
    assumptions:
        - id: A1
          status: verified
          text: gonum is absent from go.mod, so the no-new-dependency premise for rejecting it was factually true.
          evidence: 'runtime: grep -c gonum go.mod -> 0'
        - id: A2
          status: verified
          text: plan validate hard-fails when d3/dagre-d3 CDN tags are absent, directly contradicting the original slice 2 scope.
          evidence: cmd/wipnote/plan_validate.go:352-359; test at cmd/wipnote/plan_validate_test.go:164-179; plan/plantmpl/builder_test.go:190-196
        - id: A3
          status: verified
          text: Multi-rank-skipping dependency edges are common in the real corpus, so a hand-rolled layered layout would have needed dummy-node insertion.
          evidence: 'runtime: corpus scan of deps across 45 plan YAMLs; plan-1670cacd slice 8 depends on slice 1 (seven-rank gap)'
        - id: A4
          status: verified
          text: All eight cited research URLs resolve and substantiate their stated claims, including exact dates and counts.
          evidence: gh api checks on ajstarks/svgo (pushed 2022-12-09, LICENSE is literal CC-BY-4.0), zkrebbekx/go-mermaid (created 2026-06-13, 2 stars), goccy/go-graphviz (v0.2.10, 2025-11-29); WebFetch on d2 layout.go confirming go:embed of dagre.js
        - id: A5
          status: falsified
          text: The original design.problem figure of 34 block instances was wrong as stated — 22 are authored in YAML.
          evidence: 'runtime: grep over .wipnote/plans/*.yaml -> 22 (12 file-tree, 4 diagram, 4 data-model, 1 wireframe, 1 tabs, 0 api-endpoint). Reconciled: 34 is the RENDERED count because visual_overview_zone emits blocks alongside blocks_zone. Text corrected to cite both.'
        - id: A6
          status: unverified
          text: goja can execute dagre.js unmodified and return usable coordinates.
          evidence: 'unverified: d2 uses its own jsrunner abstraction and may not use goja. Slice 2 carries this as an open question with goccy/go-graphviz as the researched fallback.'
        - id: A7
          status: plausible
          text: wipnote:execute's file-overlap wave partitioning, not the declared deps, is what prevents validate.go and schema.go collisions among slices 5, 6 and 7.
          evidence: plugin/skills/execute/SKILL.md documents file-overlap partitioning; noted in each slice's decisions_notes rather than relied on silently.
        - id: A8
          status: verified
          text: FileTree and APIEndpoint are defined in plan/blocks/blocks.go, not in standalone per-type files.
          evidence: 'plan/blocks/blocks.go:81 (FileTree), plan/blocks/blocks.go:59 (APIEndpoint); runtime: find plan -iname ''*file_tree*'' returns only the template'
    critics:
        - title: DESIGN CRITIC
          sections:
            - heading: Correctness gaps
              items:
                - badge: legacy exemption
                  kind: danger
                  text: Slice 6 hardened the block gate with no finalized-plan exemption while the near-identical slice 5 had one — would have failed all 204 existing block-free slices. Fixed.
                - badge: retrieval untested
                  kind: danger
                  text: Retrieval-corpus parseability was declared a constraint then never covered by any acceptance criterion or test. Fixed in slice 1.
                - badge: vendor assets
                  kind: danger
                  text: Removing d3/dagre-d3 references left it unstated whether the vendor files are deleted, which would break every un-re-rendered legacy plan. Constraint added.
            - heading: Structure and ergonomics
              items:
                - badge: duplication
                  kind: warn
                  text: Arrowhead geometry would have been implemented twice across slices 2 and 3. Centralised in slice 1.
                - badge: unsourced number
                  kind: warn
                  text: The 16-node ceiling was the only quantitative claim not traceable to the corpus. Removed.
                - badge: bundling
                  kind: warn
                  text: Slice 6 bundled two unrelated policies into one approval unit. Split into 6 and 7.
                - badge: no dependency
                  kind: success
                  text: The no-new-dependency constraint was honoured everywhere with real, checkable research trails.
        - title: FEASIBILITY CRITIC
          sections:
            - heading: Scope defects
              items:
                - badge: build breaker
                  kind: danger
                  text: Three files enforcing the d3/dagre-d3 CDN tags were outside slice 2's scope; implementing as written would have broken every plan validate call. All added.
                - badge: missing file
                  kind: danger
                  text: dependency_graph.gohtml, the file actually holding the empty <svg>, was absent from slice 2. Added.
                - badge: invented paths
                  kind: danger
                  text: plan/blocks/file_tree.go and plan/blocks/api_endpoint.go do not exist. Corrected to plan/blocks/blocks.go, with the api_endpoint template and tests added to slice 7.
                - badge: algorithm gap
                  kind: danger
                  text: Hand-rolled Sugiyama omitted dummy-node handling for multi-rank edges, which the corpus shows are the norm. Approach replaced with embedded dagre.js.
            - heading: Evidence quality
              items:
                - badge: URLs verified
                  kind: success
                  text: All eight research URLs check out exactly, including precise dates and star counts that could easily have been misremembered.
                - badge: block count
                  kind: warn
                  text: design.problem's 34-instance figure did not match a live corpus count of 22. Corrected and reconciled.
                - badge: thresholds
                  kind: warn
                  text: The ~40/~60 word prose caps were asserted round numbers. Replaced with a requirement to derive the cap from the corpus distribution.
    risks:
        - risk: goja may not execute dagre.js unmodified, invalidating slice 2's chosen approach.
          severity: High
          mitigation: First implementation step is a spike proving dagre.js runs under goja and returns coordinates. goccy/go-graphviz (cgo-free, WASM-embedded, v0.2.10) is the pre-researched fallback.
        - risk: 'Dual-format validator window: legacy d3-format plans and new inline-SVG plans must both validate until the last plan migrates lazily.'
          severity: Medium
          mitigation: TestPlanValidate_DualFormat is a required done_when on slice 2, and the vendor assets stay on disk until migration completes.
        - risk: Slices 5, 6 and 7 all touch plan/planyaml/validate.go with no declared ordering.
          severity: Low
          mitigation: Noted explicitly in each slice's decisions_notes; execute via wipnote:execute so file-overlap partitioning serialises them.
    synthesis: |
        Both critics found real defects and the plan was rewritten rather than
        annotated. The feasibility pass was the higher-yield of the two: it caught
        three file paths that do not exist, one file omitted from the slice that
        exists to fix it, and — most seriously — that cmd/wipnote/plan_validate.go
        hard-fails when the d3/dagre-d3 CDN tags are absent, which the original
        slice 2 would have triggered on every plan. It also proved from the corpus
        that multi-rank-skipping dependency edges are the norm, which retired the
        hand-rolled Sugiyama approach in favour of embedding dagre.js the way d2
        does. The design pass caught the one outright correctness bug: slice 6
        hardening validation with no legacy exemption would have failed 204
        existing slices.

        All HIGH findings are resolved in the current YAML. Two items remain open
        for the human reviewer. First, A6 — goja executing dagre.js is unproven,
        and slice 2 is explicitly gated on a spike with a researched fallback;
        that is the single highest-risk decision in the plan. Second, slice 5's
        prose cap now requires deriving its threshold from the corpus rather than
        asserting one, so the actual number is deliberately not yet fixed. Review
        slice 2 first.
