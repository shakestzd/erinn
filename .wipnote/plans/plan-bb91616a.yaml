    - id: slice-8
      num: 8
      title: Snapshot+delta projection infra; streaming via daemon append-notify, aggregates from SQLite
      what: |
        Build the reactive projection layer with read sources routed BY SHAPE
        (slice 7 contract). Define a projection registry keyed by stable names
        (active-work, session-events:<id>, lineage:<id>, agent-activity,
        collector-status, plan:<id>). Each projection serves an SSE channel: first
        event = full snapshot with a monotonic seq, then deltas with increasing seq;
        clients reconnect with Last-Event-ID to resume. STREAMING projections (the
        activity feed, plan feed) are fed by the daemon's append-notify: the
        single-writer daemon (slices 1-2) emits a notification when it applies an op,
        and the projection pushes on that signal — replacing today's 2s SQLite poll
        (sseHandler api_transcript.go:361, planEventsHandler api_plans.go:942) with
        true push, no per-session NDJSON fan-out, no 2s flush floor. AGGREGATE
        projections (stats, session list, kanban, graph) still derive from SQLite
        (its genuine strength). Define a compaction floor (keep last N / T window);
        below it, send a fresh snapshot. Ship infra + the active-work projection.
      why: |
        Today the only streaming is a 2-second SQLite poll; everything else broad-polls
        JSON. The daemon this plan already builds is the natural append-notify source,
        so streaming becomes true push without polling and without the per-session
        NDJSON fan-out / 2s-flush blockers (research doc, Item 4; verified 2026-05-28).
      files:
        - internal/projection/registry.go
        - internal/projection/sse.go
        - internal/daemon/notify.go
        - cmd/wipnote/api_projections.go
        - cmd/wipnote/serve_child.go
      deps:
        - 1
      done_when:
        - The single-writer daemon emits an append-notify on each applied op, and streaming projections push on it (no 2s poll)
        - Opening a projection SSE channel yields a full snapshot with a monotonic seq, then deltas with increasing seq
        - Reconnecting with Last-Event-ID resumes from the client's last seq; a seq below the compaction floor receives a fresh snapshot, not an error
        - Aggregate projections derive from SQLite; streaming projections do NOT poll SQLite
      effort: M
      risk: Med
      tests: |
        Unit: TestProjectionSeq_Monotonic — snapshot seq < each subsequent delta seq.
        Integration: TestStreamingPush_NoPoll — apply an op via the daemon, assert the projection pushes without a timer tick.
        Integration: TestProjectionResume — reconnect with Last-Event-ID skips seen deltas; below-floor -> fresh snapshot.
      complexity: complex
      approved: false
      comment: ""
      questions:
        - id: q-stream-source
          text: Streaming projection source — SQLite poll, NDJSON tail, or daemon append-notify?
          answer: Daemon append-notify. The single-writer daemon sees every applied op, so it emits a push notification with no poll, no per-session NDJSON fan-out, and no 2s-flush floor. Aggregates still come from SQLite; documents go straight to canonical HTML.
      critic_revisions:
        - source: sonnet
          severity: SUCCESS
          summary: 'Verified 2026-05-28: live SSE is a 2s SQLite poll (api_transcript.go:361, api_plans.go:942), NOT an NDJSON tail; ingest.ParseFileFrom (parser.go:76) + NDJSON sink exist.'
        - source: sonnet
          severity: HIGH
          summary: NDJSON-tail would NOT eliminate the poll cheaply (one file per session + sink SyncInterval=2s); daemon append-notify is the correct push source and reuses the Phase A spine.
      decisions_notes: |
        **Trigger:** GET /api/projections/<name> as text/event-stream.
        **Read-routing-by-shape:** STREAMING -> daemon append-notify push (slices 1-2); AGGREGATE -> SQLite read-only; DOCUMENT reads go straight to canonical HTML (slice 9), not through projections.
        **State:** seq = the slice-1 writer monotonic seq (single source across streaming projections).
        **Payload:** event 1 = {type: snapshot, seq, data}; event N = {type: delta, seq, ops}.
        **Compaction:** retain last N / T window; below floor -> fresh snapshot (tested fallback).
        **Rejected:** generalizing the 2s SQLite-poll ticker (keeps the poll); naive NDJSON file-tail (per-session fan-out + sink's own 2s flush floor — verified not simpler); versioned-snapshot-push without deltas (coarse).
    - id: slice-9
