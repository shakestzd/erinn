name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -short ./...
      # The core/ module is separate (its own go.mod), so the root `./...`
      # above does not include it. Run its gates explicitly so the moved
      # core packages/tests stay covered in CI and release gates.
      - name: Build (core module)
        working-directory: core
        run: go build ./...
      - name: Vet (core module)
        working-directory: core
        run: go vet ./...
      - name: Test (core module)
        working-directory: core
        env:
          # core/daemon lease tests require the test-binary path or the project
          # root to contain "wipnote" (isWriterProcessImpl guard). Set GOTMPDIR
          # to a wipnote-named dir under RUNNER_TEMP so the compiled test binary
          # path contains "wipnote", satisfying the guard without touching tests.
          GOTMPDIR: ${{ runner.temp }}/wipnote-test
        run: mkdir -p "$GOTMPDIR" && go test -short ./...
      # The plan/ module is separate (its own go.mod, depends on core/), so the
      # root `./...` above does not include it. Run its gates explicitly so the
      # lifted planning packages/tests stay covered in CI and release gates.
      - name: Build (plan module)
        working-directory: plan
        run: go build ./...
      - name: Vet (plan module)
        working-directory: plan
        run: go vet ./...
      - name: Test (plan module)
        working-directory: plan
        run: go test -short ./...
      # The port/ module is separate (its own go.mod), so the root `./...`
      # above does not include it. Run its gates explicitly so the lifted
      # pluginbuild generator packages/tests stay covered in CI and release
      # gates. (port/ also houses the generated Codex/Gemini target trees.)
      - name: Build (port module)
        working-directory: port
        run: go build ./...
      - name: Vet (port module)
        working-directory: port
        run: go vet ./...
      - name: Test (port module)
        working-directory: port
        run: go test -short ./...
      # The observe/ module is separate (its own go.mod, depends on core/ and
      # port/), so the root `./...` above does not include it. Run its gates
      # explicitly so the lifted dashboard + OTEL collector/ingest packages and
      # tests stay covered in CI and release gates.
      - name: Build (observe module)
        working-directory: observe
        run: go build ./...
      - name: Vet (observe module)
        working-directory: observe
        run: go vet ./...
      - name: Test (observe module)
        working-directory: observe
        run: go test -short ./...
      - name: Acceptance harness (CI-safe, fake binaries)
        # Runs the small CI-safe subset of the parallel-launcher acceptance
        # harness (plan-1670cacd slice-10, feat-7835351a). Uses fake DB rows
        # and the existing API handlers — no real harness binaries, no network.
        # The larger stress harness (TestSQLiteContentionStress) is opt-in:
        #   go test -run TestSQLiteContentionStress -count=3 ./cmd/wipnote/
        # See docs/runbook/launcher-isolation.md for the full release gate.
        run: |
          export TMPDIR=/tmp
          go test -short -run 'TestParallelHarnessLineage|TestParallelHarness_MainStaysClean|TestMultiHarnessIngestion' ./cmd/wipnote/
