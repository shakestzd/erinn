          text: How is staleness measured per table?
          answer: Compare the derived table's last-applied seq/offset against the canonical high-water mark (latest NDJSON offset / latest .html mtime). A gap = stale; zero gap = fresh. The seq concept is the slice-1 monotonic seq.
      critic_revisions:
        - source: sonnet
          severity: HIGH
          summary: Plan overstated reuse — the write-SITE enum (sqlite_write_boundary_test.go:59) is a different axis than table-level classification; this is a NEW registry that complements it. Added dep on slice 1 (seq concept).
        - source: haiku
