        last-applied time, and a staleness flag computed as derived-applied-seq vs
        canonical high-water mark (latest NDJSON offset / latest .html mtime; the seq
        concept comes from slice 1). Add a dashboard DB-health panel. (plugin/static/
        dashboard is a directory; the panel is one asset within it.)
      why: |
        The research doc's first dependency: before/while changing write topology, the
        rebuildable contract must be explicit and staleness must be visible. Today the
        classification lives only in a test inventory and the dashboard has no
