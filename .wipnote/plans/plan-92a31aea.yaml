meta:
    id: plan-92a31aea
    track_id: trk-6a1f5362
    title: Dashboard-styled launcher choosers (huh TUI)
    description: ""
    created_at: ""
    status: draft
    schema_version: v4
    version: 1
design:
    problem: |
        The `wipnote claude` (and yolo/antigravity) launch + session-resume chooser is
        rendered as a flat numbered list via ~24 lines of fmt.Fprintf in promptLaunchIntent
        (cmd/wipnote/claude_chooser.go:109-156). It reads "terrible": no color, no visual
        hierarchy, section headers are bare strings, each row is a long flat parenthesized
        string, and the post-selection banner ("Warning: dirty branch", "Launching Claude
        Code", "Session:") is an unstyled wall of prints. It looks nothing like the dashboard.
    goals:
        - 'Replace the numbered chooser with an arrow-key-navigable charmbracelet/huh Select that echoes the dashboard palette (accent #CDFF00 on dark #151518/#1C1C20).'
        - Restyle the post-selection launch/warning/session banner into a consistent framed block.
        - 'Apply the same styled chooser + banner across ALL launcher entrypoints: claude, yolo, antigravity.'
        - Preserve the existing non-TTY/scriptable fallback so piped-stdin tests, CI, and automation keep working unchanged.
    constraints:
        - New runtime dependency on charmbracelet is accepted (user-approved). Use STABLE huh v1 — v2 and bubbletea v2 are pre-release.
        - Non-TTY (no char-device stdin) MUST bypass the TUI and behave exactly as today (chooser skipped -> NewWorkIntent, or numeric fallback).
        - Do not edit generated plugin trees, AGENTS.md, or CLAUDE.md.
        - Echo the dashboard's existing palette tokens; do not invent a new color scheme.
    approved: false
    comment: ""
    research:
        - url: https://pkg.go.dev/github.com/charmbracelet/huh/v2
          claim: huh Select form API (NewSelect/NewGroup/NewForm), WithTheme, and WithAccessible(bool); confirms v2 is pre-release (v2.0.0-2025... pseudo-version) so stable v1 is the adopt target.
          accessed: "2026-06-18"
        - url: https://pkg.go.dev/github.com/charmbracelet/lipgloss
          claim: lipgloss auto-degrades colors to the best the terminal supports and strips color entirely when output is not a TTY — basis for the dashboard-palette terminal styling and safe non-TTY behavior.
          accessed: "2026-06-18"
        - url: https://www.inngest.com/blog/interactive-clis-with-bubbletea
          claim: Confirms huh/bubbletea is the mainstream, battle-tested Go path for interactive CLI selection lists — adopt-vs-build favors adopting rather than hand-rolling a TUI.
          accessed: "2026-06-18"
slices:
    - id: slice-1
      num: 1
      title: Add charmbracelet huh/lipgloss deps + shared dashboard tui theme package
      what: |
        Add stable charmbracelet/huh (v1) + charmbracelet/lipgloss to the cmd module's
        go.mod. Create a small shared package (cmd/wipnote/launchtui or internal/launchtui)
        that encodes the dashboard palette as lipgloss styles and a huh theme constructor
        (e.g. wipnoteTheme() *huh.Theme) plus named lipgloss.Style helpers (accent, muted,
        title, sectionHeader, frame). Single source for colors: mirror plugin/static
        has-styles.css tokens (accent #CDFF00, accent-text #0A0A0A, bg #151518/#1C1C20,
        text #E0DED8, muted #707070, status blue/green/red). No behavior change yet —
        this is the foundation consumed by slices 2-4.
      why: |
        DRY: chooser (slice 2), banner (slice 3), and yolo/antigravity reuse (slice 4) all
        need the same palette + theme. Centralizing avoids three divergent copies of the
        color constants and keeps "consistent with dashboard style" enforceable in one file.
      files:
        - go.mod
        - go.sum
        - cmd/wipnote/launchtui/theme.go
        - cmd/wipnote/launchtui/theme_test.go
      deps: []
      done_when:
        - go.mod pins stable huh v1 (NOT a v2 pre-release pseudo-version) and lipgloss; go mod tidy is clean across affected modules.
        - launchtui exposes a wipnoteTheme()/Styles constructor returning the dashboard palette as lipgloss styles + a huh theme.
        - 'A unit test asserts the key hex tokens (accent #CDFF00, bg #151518) are present in the produced styles so palette drift is caught.'
      effort: S
      risk: Low
      tests: |
        Unit: TestWipnoteTheme_PaletteTokens — construct the theme/styles and assert the
        accent + background hex values match the dashboard tokens.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://pkg.go.dev/github.com/charmbracelet/huh/v2
          claim: huh.ThemeBase/ThemeCharm + custom Styles struct (FieldStyles with SelectSelector/Option lipgloss.Style) is the supported way to theme a Select; v2 pseudo-version confirms v1 is the stable pin.
          accessed: "2026-06-18"
        - url: https://pkg.go.dev/github.com/charmbracelet/lipgloss
          claim: lipgloss.Color hex + Style.Foreground/Background is the API for encoding the palette; adopted instead of hand-rolling ANSI escape codes.
          accessed: "2026-06-18"
      decisions_notes: |
        **Scope:** new launchtui package + go.mod dep only; no caller wired yet.
        **State:** none — pure style constructors, in-memory.
        **Decisions:** Adopt huh+lipgloss rather than hand-roll ANSI (user-approved new dep;
          adopt-vs-build resolved toward the battle-tested charm ecosystem). Pin huh v1
          STABLE because huh v2 + bubbletea v2 are pre-release pseudo-versions (unverified
          stability) — confirmed via pkg.go.dev showing v2.0.0-2025... .
        **Rejected:** raw bubbletea+lipgloss hand-built model (more code/maintenance for the
          same Select UX); lipgloss-only styling of the numbered menu (no arrow-key nav —
          user chose the full huh TUI); hand-rolled ANSI (fiddly, reinvents lipgloss).
        Exact v1 tag is pinned at implementation via `go get github.com/charmbracelet/huh@latest` (marked unverified until pinned).
    - id: slice-2
      num: 2
      title: Styled huh Select chooser in promptLaunchIntent with non-TTY fallback
      what: |
        Replace the fmt.Fprintf menu body of promptLaunchIntent (claude_chooser.go:109-156)
        with a huh Select form built from the same data: a "Start something new" option plus
        grouped "Resume in <harness>" (grouped.SameHarness) and "Continue from other
        harnesses" (grouped.CrossHarness) options. Render each ResumableSession row as a
        styled multi-field option (work-item id, title, type, harness, relative last-activity,
        Live badge, worktree) via launchtui styles instead of the flat describeresumablesession
        string. Map the selected option back to the existing LaunchIntent values
        (NewWorkIntent / resume / cross-harness handoff) with identical semantics.

        Fallback contract: the upstream TTY gate (shouldOfferLaunchIntentChooser ->
        isInteractiveTerminalFile, claude_chooser.go:34/44) is preserved unchanged — non-TTY
        stdin still skips the chooser entirely. When interactive but huh cannot run (e.g.
        ACCESSIBLE env / huh.Run error), fall back to the existing bufio numeric-prompt path
        rather than failing the launch.
      why: |
        This is the core user request — the chooser "looks terrible." huh gives arrow-key nav,
        sections, and dashboard styling while reusing the ResumableSession data that already
        carries every field needed (per code map).
      files:
        - cmd/wipnote/claude_chooser.go
        - cmd/wipnote/claude_chooser_test.go
      deps:
        - 1
      done_when:
        - On a real TTY, the chooser renders as a styled huh Select with grouped sections and dashboard accent coloring.
        - Selecting any option returns the SAME LaunchIntent the numbered menu returned for that row (new / resume / cross-harness handoff).
        - Non-TTY / piped stdin behaves exactly as before — chooser bypassed, no huh invoked, existing claude_chooser_test.go assertions pass unmodified or with only output-format updates.
        - When huh.Run errors or ACCESSIBLE is set, the numeric bufio fallback path still resolves an intent (launch never hard-fails on TUI error).
      effort: M
      risk: Med
      tests: |
        Unit: TestPromptLaunchIntent_NonTTYBypass — non-char-device input yields NewWorkIntent
        with no huh invocation.
        Unit: TestPromptLaunchIntent_SelectionMapping — given a grouped session set, each
        selectable index maps to the correct LaunchIntent (drive via accessible/programmable
        input or a seam over the selection result).
        Unit: TestPromptLaunchIntent_FallbackOnTUIError — forced huh failure falls through to
        the numeric reader and still returns an intent.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://pkg.go.dev/github.com/charmbracelet/huh/v2
          claim: WithAccessible(bool) + RunAccessible(w,r) is the documented non-TUI path; accessible mode is explicit (NOT automatic TTY detection) — so the code must keep its own TTY guard, confirming the preserved-fallback design.
          accessed: "2026-06-18"
        - url: https://pkg.go.dev/github.com/charmbracelet/lipgloss
          claim: lipgloss strips color when output is not a TTY — safe for the fallback/redirect path.
          accessed: "2026-06-18"
      questions:
        - id: q-select-type
          text: What type should huh.NewSelect carry — the resolved LaunchIntent value, or an index into the flattened option list that we map back afterward?
          answer: Index into the flattened [new + SameHarness + CrossHarness] option list, mapped back to LaunchIntent after Run. Keeps Select[int] simple/comparable and reuses the exact same ordering the numbered fallback uses, so both paths resolve identically.
        - id: q-fallback-trigger
          text: When does the numeric bufio fallback fire instead of the huh TUI?
          answer: Only when stdin is interactive (passes the existing char-device gate) AND huh cannot run — i.e. ACCESSIBLE env is set or huh.Run returns an error. Pure non-TTY still bypasses the chooser entirely upstream, as today.
      decisions_notes: |
        **Trigger:** promptLaunchIntent is reached only after shouldOfferLaunchIntentChooser
          confirms an interactive char-device stdin (existing gate, unchanged).
        **State:** none new — reads existing HarnessGroupedResumableSessions
          (core/db/session_repo.go:527); selection maps to existing LaunchIntent type.
        **Payload:** huh Select[LaunchIntent or index] -> resolved LaunchIntent; option labels
          built from ResumableSession fields via launchtui styles.
        **Decisions:** Keep the bufio numeric reader as an explicit fallback rather than
          deleting it (user requirement: scriptable/non-interactive must keep working; huh's
          accessible mode is opt-in, not automatic). Preserve describeResumableSession content
          but re-render it as styled fields; keep the function for the fallback path.
        **Rejected:** removing the numeric path (breaks tests + automation — user chose "must
          keep scriptable fallback"); relying on huh to auto-detect non-TTY (it does not —
          confirmed via pkg.go.dev WithAccessible being explicit).
    - id: slice-3
      num: 3
      title: Restyle launch/warning/session banner into a framed dashboard block
      what: |
        Wrap the post-selection banner lines into a consistent lipgloss-framed block via a
        shared launchtui helper (e.g. RenderLaunchBanner). Covers: the dirty-protected-branch
        warning (launcher_mode.go:79-80/104-105), the "Launching Claude Code ... / Plugin
        source / Session" lines (claude.go:243-248 dev, 515-517 default, plus auto/init/continue
        banners), and emitLaunchPreparationStatus (launcher_continue.go:266-271). Use the
        dashboard accent for the launch headline, muted style for path/session detail, and a
        status color (amber/red) for the dirty-branch warning. Honor non-TTY: lipgloss
        degrades to plain text when output is not a terminal.
      why: |
        The user asked to make the whole launch surface "consistent with our dashboard style,"
        not just the chooser list. The banner is the other half of what reads as "terrible."
      files:
        - cmd/wipnote/launchtui/banner.go
        - cmd/wipnote/claude.go
        - cmd/wipnote/launcher_mode.go
        - cmd/wipnote/launcher_continue.go
      deps:
        - 1
      done_when:
        - Launch/warning/session lines render as a single coherent framed block using dashboard accent + muted + status colors on a TTY.
        - On non-TTY output the banner degrades to readable plain text (no raw escape codes), preserving existing log-scrape behavior.
        - The dirty-branch warning remains clearly distinguished (status color) and is still emitted on the hard-block path.
      effort: M
      risk: Low
      tests: |
        Unit: TestRenderLaunchBanner_PlainOnNonTTY — banner rendered to a non-TTY writer
        contains the literal session id / warning text and no ANSI escape sequences.
        Unit: TestRenderLaunchBanner_AccentOnTTY — forced color profile includes the accent.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://pkg.go.dev/github.com/charmbracelet/lipgloss
          claim: lipgloss.Style.Border/Padding/Foreground compose a framed block; color is auto-stripped on non-TTY — covers both the styled and plain banner requirements.
          accessed: "2026-06-18"
      decisions_notes: |
        **Scope:** banner-only restyle across the four launcher print sites; reuses slice-1
          launchtui styles.
        **State:** none — pure rendering of strings already computed by plan.PlanLaunch.
        **Decisions:** Centralize banner rendering in launchtui (DRY) rather than inline
          lipgloss at each of the ~6 print sites. Keep stderr/stdout destinations as-is so
          existing redirection contracts hold.
        **Rejected:** styling each print site independently (duplication, drift); moving
          warning to stdout (would change scrape/redirect behavior).
    - id: slice-4
      num: 4
      title: Route yolo + antigravity launchers through the shared styled chooser/banner
      what: |
        Ensure `wipnote yolo` and `wipnote antigravity` (agy) launch entrypoints render the
        same styled huh chooser (slice 2) and framed banner (slice 3) as `wipnote claude`.
        Audit how each entrypoint resolves launch intent today (whether it already calls the
        shared promptLaunchIntent / resolveLaunchIntentForDefaultLaunch path or has its own
        print code), and route all of them through the single shared renderer, passing the
        correct harness label via formatHarnessName. No new chooser logic — only wiring +
        harness-label correctness.
      why: |
        User explicitly chose "All launcher choosers (claude + yolo + antigravity)." A
        consistent look across entrypoints is the point; divergence would reintroduce the
        "terrible" inconsistency for two of three launchers.
      files:
        - cmd/wipnote/yolo.go
        - cmd/wipnote/antigravity.go
        - cmd/wipnote/claude_chooser.go
      deps:
        - 2
        - 3
      done_when:
        - wipnote yolo and wipnote antigravity present the same styled huh chooser + framed banner as wipnote claude, with the correct harness name in section headers.
        - Each entrypoint preserves its own non-TTY fallback (no TUI when stdin is not a char device).
        - go build ./... && go vet ./... && go test ./... pass across all five modules.
      effort: M
      risk: Med
      tests: |
        Unit: TestYoloChooser_UsesSharedRenderer / TestAntigravityChooser_UsesSharedRenderer —
        assert the shared promptLaunchIntent path is invoked with the right harness, and
        non-TTY bypass holds for each.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Internal wiring of existing wipnote yolo/antigravity entrypoints to the shared chooser — no external library or standard applies beyond slices 1-3 (already cited). Exact current call paths for yolo/antigravity are unverified until the implementation audit; the slice begins with that audit.
      decisions_notes: |
        **Scope:** wiring only — point yolo/antigravity intent resolution at the shared
          promptLaunchIntent/resolveLaunchIntentForDefaultLaunch path; no new UI code.
        **State:** none new.
        **Decisions:** Single shared chooser renderer for all three harnesses (DRY, matches
          user's "all launchers" choice). The file list for yolo.go/antigravity.go is a
          best-guess from the entrypoint naming convention and is UNVERIFIED — slice opens by
          confirming the real entrypoint files and intent-resolution call sites before editing.
        **Rejected:** per-harness chooser copies (reintroduces the inconsistency we're fixing).
questions: []
