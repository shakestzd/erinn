        - /api/db-health returns per-table classification, last-applied seq/time, and a staleness flag (gap between derived seq and canonical high-water mark)
        - The dashboard renders a DB-health panel showing stale tables and last reindex time
        - 'The contract documents read-routing-by-shape: streaming reads -> daemon append-notify, single-document reads -> canonical HTML, aggregate reads -> SQLite'
      effort: S
