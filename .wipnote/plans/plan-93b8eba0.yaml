        - Slices with blocks render a Blocks zone in plan-*.html via the shared renderers
        - Before/after wireframes render from HTML/CSS design tokens with no external assets or screenshots
        - 'No DRY duplication: plan and recap share the same block render code path'
      effort: L
      risk: Med
      tests: |
        Unit: TestPlanPage_BlocksZone golden file; TestWireframe_TokensOnly (rejects raw
        hex/rgb). Snapshot the rendered block HTML.
      complexity: complex
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      questions:
        - id: q-wireframe-tokens
          text: Reuse the dashboard's existing CSS token system or introduce --wf-* tokens?
          answer: Introduce a small --wf-* wireframe token set scoped to wireframe markup (matches BuilderIO's tokens-not-hex rule) while pulling base palette values from the existing dashboard tokens to stay visually consistent.
      decisions_notes: |
        **Scope:** rendering only (schema is slice-6). Reuse plan/blocks from slice-2 — this slice adds the wireframe renderer + the plan Blocks zone wiring. **State:** none. **Payload:** HTML zone appended to PlanPage. **Rejected:** Playwright/screenshot wireframes (hard constraint — no headless infra; HTML/CSS wireframes are the BuilderIO approach too); a plan-only block renderer (DRY — must share with recap).
        **Module:** plantmpl blocks import plan/blocks (same plan module). Shared with recaptmpl (root module) per slice-2's resolution.
    - id: slice-8
      feature_id: feat-4addaa6f
      num: 8
      title: Block-level annotation loop for PLANS (consumed/resolved) on plan_feedback — recap annotation explicitly out of scope
      what: |
        Extend the existing plan-review dashboard chat + critic_revisions/questions to
        support block/element-anchored annotations on PLANS with a two-axis state
