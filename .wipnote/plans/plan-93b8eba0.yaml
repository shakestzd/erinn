meta:
    id: plan-93b8eba0
    track_id: trk-a951e3c0
    title: Visual plan & lineage-grounded recap (native port of BuilderIO visual-plan/visual-recap)
    description: |
        Research basis:
        - https://github.com/BuilderIO/skills/tree/main/skills/visual-plan (read 2026-06-18, SKILL.md sha df2235e5): visual-plan's skill logic is prompt-only BUT depends on a HOSTED Agent-Native Plans web app + MCP connector (plan.agent-native.com) to render/store output — exactly the third-party dependency Path B removes. It drives the agent to fetch a live block catalog (get-plan-blocks), author structured MDX blocks grounded in real files, and publish to the hosted Agent-Native Plans web app for human review. Blocks: data-model, api-endpoint, diff, annotated-code, file-tree, diagram, WireframeBlock, columns, Mermaid, tabs, rich-text, question-form.
        - https://github.com/BuilderIO/skills/tree/main/skills/visual-recap (read 2026-06-18, SKILL.md sha 0d53e8fd): visual-recap is the reverse — turns a PR/branch/commit/diff into an interactive recap (UI wireframes -> outcome narrative -> schema/contract blocks -> file map -> annotated diffs in tabs), derived MECHANICALLY from the real diff. No Playwright/screenshots; all visual output is MDX blocks rendered by the web app. Local-files privacy mode exists.
        - web-verified 2026-06-18 (WebSearch/WebFetch, live sources): (a) BuilderIO skills HARD-DEPEND on the hosted plan.agent-native.com MCP connector; local-files mode CONFIRMED via AGENT_NATIVE_PLANS_MODE=local-files -> writes MDX to .agent-native/plans/<slug>/ served by `plan local serve` (proof a local-first port is viable — this is what Path B internalizes). (b) SKILL PORTABILITY VERIFIED across all three harnesses: Claude Code, Codex CLI, and Gemini CLI all implement the Agent Skills open standard (agentskills.io; name+description required, allowed-tools/metadata/compatibility optional) — so slices 5/9 build-ports fan-out needs NO skill->agent/command translation. Sources (accessed 2026-06-18): https://raw.githubusercontent.com/BuilderIO/skills/main/skills/visual-recap/SKILL.md, https://code.claude.com/docs/en/skills, https://developers.openai.com/codex/skills, https://geminicli.com/docs/cli/skills/, https://agentskills.io/specification. (c) BuilderIO block catalog is DYNAMIC (get-plan-blocks; "tags drift, do not memorize") — wipnote's `wipnote plan blocks` (slice-6) is the correct native equivalent; the port must NOT hardcode block tags.
        - runtime: repo read 2026-06-18 (researcher): wipnote already owns the equivalent surfaces — plan-*.yaml->plan-*.html via commitPlanChange (cmd/wipnote/plan_yaml_cmds.go:42) + component-based renderer plan/plantmpl/ with a D3 dep-graph zone; dashboard SPA (cmd/wipnote/dashboard/, vanilla JS + D3 v7 + Prism + marked + DOMPurify) injects scoped plan HTML via /api/plans/<id>/render; lineage walk in cmd/wipnote/lineage.go (sessions->features->commits->files). No screenshot/headless/mermaid infra anywhere.

        Strategy: Path B (NATIVE PORT). Adopt BuilderIO's CONCEPTS (block catalog, recap-from-diff, before/after wireframes, annotation loop) onto wipnote's own pipeline. NO hosted Agent-Native Plans MCP dependency — local-first, single-source-of-truth (HTML canonical), reuse existing D3 + vanilla JS, wireframes are plain HTML/CSS (no Playwright). Recap's unique angle vs BuilderIO: grounded in wipnote LINEAGE, so it carries causal provenance a diff-only tool cannot.

        Phase 1 (slices 1-5): lineage-grounded recap vertical slice — new internal/recap collector, new recap/recaptmpl renderer, `wipnote recap` command writing a first-class .wipnote/recaps/recap-*.html artifact, dashboard Recaps view, and the /visual-recap skill wrapper.
        Phase 2 (slices 6-9): visual-plan block enrichment — additive slice-schema blocks, shared block renderers in plantmpl, annotation loop mapped onto existing critic_revisions/questions + plan-review chat, and the /visual-plan skill wrapper.

        Relates to plan-243e8713 (shares lineage data + D3/dashboard surface; does not overlap scope).
    created_at: "2026-06-18"
    status: finalized
    priority: medium
    schema_version: v3
    version: 3
design:
    problem: |
        BuilderIO's /visual-plan and /visual-recap give agents rich, reviewable visual artifacts (block-structured plans; recaps that turn a diff into an interactive summary), but they depend on a hosted third-party MCP (Agent-Native Plans). wipnote already owns equivalent rendering surfaces (plantmpl, the serve dashboard, lineage) yet exposes plans as a single layout, has no recap surface at all, and emits lineage as text only. We want the same visual ergonomics, natively and local-first, with recap grounded in wipnote's unique causal lineage.
    goals:
        - 'Ship a first-class lineage-grounded recap: `wipnote recap` writes a committed recap-*.html accepting work-item / git-range / session inputs'
        - Enrich plans with structured visual blocks (data-model, api-endpoint, file-tree, before/after HTML wireframes) via one shared renderer
        - Surface recaps and enriched plans in the existing dashboard with no new frontend dependencies
        - Expose /visual-recap and /visual-plan skills portable across Claude/Codex/Gemini via build-ports
        - 'Keep everything local-first: no hosted MCP, HTML stays canonical'
    constraints:
        - 'Local-first: no hosted Agent-Native Plans MCP dependency; no data leaves .wipnote/'
        - 'Single-source-of-truth: HTML is generated/canonical; never hand-edit recap-*.html or plan-*.html'
        - Reuse existing D3 v7 + vanilla JS + Prism; no new frontend frameworks
        - Before/after wireframes are plain HTML/CSS design tokens; no Playwright/screenshots/headless
        - Plan-schema additions must be additive-optional (existing v3 plans validate unchanged)
        - Skills build across all 3 harnesses via `wipnote plugin build-ports`
        - Never author or overwrite project AGENTS.md/CLAUDE.md (plugin/project boundary)
    approved: false
    comment: ""
slices:
    - id: slice-1
      feature_id: feat-5cdb3732
      num: 1
      title: Recap collector core — resolve work-item / git-range / session into grounded diff data
      what: |
        New internal/recap package. A collector that, given one of three inputs
        (work-item id feat/bug/spike, a git range commit/branch/PR, or a session id),
        mechanically resolves the set of commits + changed files + per-file diff hunks.
        For work-item and session inputs, walk the existing lineage graph
        (extract the BFS walk from cmd/wipnote/lineage.go into internal/lineage so both
        the CLI and the collector consume it — DRY). Emit a typed RecapData struct
        (outcome facts, file list with change flags, hunks, lineage chain, provenance).
      why: |
        Recap's differentiator is causal grounding: every fact derived from real
        commits/files, never inferred. This is the data layer the whole feature stands on.
      files:
        - internal/recap/collect.go
        - internal/recap/types.go
        - internal/lineage/walk.go
        - cmd/wipnote/lineage.go
      deps: []
      done_when:
        - Given a feat-id, collector returns the commits linked via lineage and the union of changed files with add/modify/delete flags
        - Given a git range (e.g. main..HEAD), collector returns the same RecapData shape with no work-item grounding
        - Given a session id, collector returns files/commits produced in that session
        - Lineage BFS walk is shared between cmd/wipnote/lineage.go and internal/recap (no duplicated traversal)
        - TestCollect consumes the shared internal/lineage walk — cmd/wipnote/lineage.go retains no private BFS copy (DRY enforced)
      effort: L
      risk: Med
      tests: |
        Unit: TestCollect_FromFeature (fixture .wipnote + git repo), TestCollect_FromRange,
        TestCollect_FromSession. Assert deterministic file/hunk sets. Table-driven.
      complexity: complex
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      questions:
        - id: q-range-no-lineage
          text: When input is a bare git range with no work-item, should recap still render a (degraded) lineage zone or omit it?
          answer: Omit the lineage zone gracefully when there is no work-item grounding; render only the diff/file/outcome zones. The lineage zone is the value-add when grounding exists, not a hard requirement.
      critic_revisions:
        - source: local-feasibility
          severity: success
          summary: BFS extraction to internal/lineage is a clean intra-root-module refactor; pure walk takes only *sql.DB (lineage.go:294), cobra wiring stays in cmd/.
        - source: local-feasibility
          severity: info
          summary: 'No diff lib in any go.mod — decided: shell out to git diff --unified=3 (no new dep).'
      decisions_notes: |
        **Scope:** internal/recap owns collection only (no rendering). Extract lineage BFS to internal/lineage to avoid a second traversal implementation.
        **State:** RecapData is in-memory, derived; the committed artifact (slice-3) is canonical. Grounded entirely in git + .wipnote/*.html, nothing external.
        **Payload:** RecapData{Outcome, Files[]{Path,Change,Hunks}, Commits[], LineageChain, Provenance}. Hunks carry before/after for the diff renderer.
        **Rejected:** parsing `git diff` text in the renderer (re-parse risk + couples layers); a recap-specific lineage walk separate from the CLI's (DRY violation, drift risk).
        **Module:** internal/recap and internal/lineage are ROOT-module packages (github.com/shakestzd/wipnote/internal/...). The BFS extraction is an intra-root-module refactor: move pure bfsWalk/forwardWalk/backwardWalk/annotateTimestamps + lineageNode types into internal/lineage; the cobra wiring (newLineageCmd, openReadOnlyDB, findWipnoteDir in cmd/wipnote/lineage.go) STAYS in cmd/ (import direction: internal must not import cmd). Verified extractable — BFS takes only *sql.DB (cmd/wipnote/lineage.go:294).
        **Diff acquisition:** shell out to `git diff --unified=3 -- <file>` and parse minimal unified-diff hunks (consistent with wipnote's existing git subprocess usage). No diff library added — none present in any of the 5 go.mod files; a hand-rolled go-diff dep is rejected as unnecessary.
    - id: slice-2
      feature_id: feat-2570725c
      num: 2
      title: Recap renderer — recap/recaptmpl package + shared HTML block components
      what: |
        New recap/recaptmpl package mirroring plan/plantmpl: RecapPage.Render(io.Writer)
        composed of zone Components — OutcomeNarrative, FileTree, AnnotatedDiff (split/unified,
        syntax-highlighted via the Prism classes the dashboard already loads, with per-hunk
        summaries), and LineageChain (reuse the D3 force-graph approach from dependency_graph.gohtml).
        Build the data-model/api-endpoint/file-tree/diff block renderers as a SHARED package
        (plan/blocks or internal/htmlblocks) so Phase 2's plantmpl blocks reuse them verbatim.
      why: |
        Renders RecapData into the canonical HTML artifact. Building blocks as shared
        components now prevents a DRY violation when visual-plan needs the same blocks (Phase 2).
      files:
        - recap/recaptmpl/recaptmpl.go
        - recap/recaptmpl/builder.go
        - recap/recaptmpl/templates/recap_page.gohtml
        - recap/recaptmpl/templates/annotated_diff.gohtml
        - plan/blocks/blocks.go
      deps:
        - 1
      done_when:
        - RecapPage.Render produces valid standalone HTML with outcome, file-tree, annotated-diff, and (when present) lineage zones
        - Annotated diff renders split + unified modes with Prism-compatible markup and per-hunk summaries
        - data-model/api-endpoint/file-tree/diff block renderers live in a shared package consumed by recaptmpl (and ready for plantmpl)
      effort: L
      risk: Med
      tests: |
        Unit: TestRecapPage_Render golden-file test; TestAnnotatedDiff_SplitVsUnified;
        TestBlocks_FileTree/DataModel render snapshots. Use go:embed templates.
      complexity: complex
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      questions:
        - id: q-shared-pkg
          text: Where should the shared block renderers live so both recap and plan import them without an import cycle?
          answer: 'plan/blocks — a leaf package in the existing plan module. Both plantmpl (same module) and recaptmpl (root module, which already depends on plan) import it one-way. internal/htmlblocks is rejected: the separate plan module cannot import root''s internal/.'
      critic_revisions:
        - source: local-feasibility
          severity: danger
          summary: 'RESOLVED: recap/recaptmpl = root-module package (no 6th module); plan/blocks = package in existing plan module. internal/htmlblocks rejected (cross-module internal import illegal).'
        - source: local-feasibility
          severity: info
          summary: 'Citation fix: lineage force-graph is app.js:2558 (dashboard SPA), not dependency_graph.gohtml (dagre-d3). Standalone recap uses static SVG; interactive graph only via dashboard injection.'
      decisions_notes: |
        **Scope:** Pure rendering. recaptmpl mirrors plantmpl's Component interface (Render(io.Writer)); outer shell text/template, inner zones html/template (matches plantmpl's JS-safety split).
        **State:** none — stateless renderer over RecapData.
        **Payload:** HTML string artifact. Diff uses Prism classes (already CDN-loaded by dashboard) — no new highlighter dep.
        **Rejected:** Mermaid for the lineage zone (no mermaid infra in repo, new dep) — reuse the existing D3 force-graph instead; a recap-only block set (would force a Phase-2 rewrite — build shared from the start).
        **Module (RESOLVED):** recap/recaptmpl is a ROOT-module package (github.com/shakestzd/wipnote/recap/recaptmpl) — NOT a new 6th module: no recap/go.mod, no root replace directive. The shared block package is plan/blocks, a package in the EXISTING plan module (github.com/shakestzd/wipnote/plan); the root module already depends on plan, so recaptmpl->plan/blocks is legal. plan/blocks MUST be a leaf (no deps on plantmpl or recaptmpl). NOTE: internal/htmlblocks is REJECTED — root's internal/ cannot be imported by the separate plan module (plantmpl needs it too), so the shared pkg must live under plan/.
        **Lineage zone (citation fix):** standalone recap HTML uses a STATIC SVG / tabular lineage chain (the dashboard force-simulation at app.js:2558 needs the SPA runtime and cannot run in a committed file). The interactive force-graph is reserved for the dashboard /api/recaps/<id>/render injection path. Correction: dependency_graph.gohtml uses dagre-d3, not force-sim — do not cite it as the force-graph source.
        **Prism:** recap HTML is self-contained; opened directly (not via dashboard) Prism is absent, so the annotated diff degrades gracefully to plain <pre><code> (no inlining the full Prism bundle per artifact); full highlighting only on the dashboard injection path.
    - id: slice-3
      feature_id: feat-1feacf19
      num: 3
      title: '`wipnote recap <id|--range|--session>` command + first-class recap-*.html artifact commit'
      what: |
        New cmd/wipnote/recap.go cobra command. Accepts a work-item id positional,
        or --range <gitrange>, or --session <id>. Calls the collector (slice-1),
        renders via recaptmpl (slice-2), writes .wipnote/recaps/recap-<id>.html, and
        commits it atomically via a commitRecapArtifact helper modeled on
        commitWipnoteArtifact/commitPlanChange (git -C <repoRoot> absolute path, no host
        paths in body). Wires a lineage edge recap relates_to/derived_from the work item.
      why: |
        Makes recap a durable, shareable, lineage-linked object in the canonical store —
        not an ephemeral view. Required before the dashboard and skill can surface it.
      files:
        - cmd/wipnote/recap.go
        - cmd/wipnote/recap_commit.go
      deps:
        - 1
        - 2
      done_when:
        - '`wipnote recap feat-XXX` writes and commits .wipnote/recaps/recap-feat-XXX.html'
        - --range and --session inputs produce a recap artifact with a stable id scheme
        - Recap artifact is linked to its work item via a typed lineage edge visible in `wipnote lineage`
      effort: M
      risk: Low
      tests: |
        Integration: TestRecapCmd_Feature (spawn binary in fixture repo, assert file +
        commit + link), TestRecapCmd_Range. Guard slow ones behind testing.Short().
      complexity: standard
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      critic_revisions:
        - source: local-feasibility
          severity: success
          summary: 'commitRecapArtifact is feasible — model on commitWipnoteArtifact (workitem_commit.go:67): git -C repoRoot + absolute paths + advisory lock; no YAML re-render step needed.'
      decisions_notes: |
        **Trigger:** explicit CLI invocation only (not a hook). **State:** .wipnote/recaps/recap-*.html canonical, committed via git -C repoRoot (bypasses worktree .wipnote/ gitignore, like existing artifact commits). **Payload:** recap id scheme recap-<workitem-id> for items, recap-<short-hash> for bare ranges. **Rejected:** reusing plan-*.html pipeline (conflates plan vs recap semantics in store — user chose a distinct kind); dashboard-only no-artifact (not durable/shareable, not in canonical store).
        **ID scheme & lifecycle:** recap-<workitem-id> for work items (idempotent — regenerating overwrites in place); recap-r-<12-char hash of the range spec> for bare git ranges; recap-s-<session-short-id> for sessions. Work-item recaps are overwrite-on-regenerate. `wipnote recap list|show|delete` and discoverability live in slice-10.
    - id: slice-4
      feature_id: feat-63676de5
      num: 4
      title: Dashboard Recaps view + /api/recaps endpoints
      what: |
        Add /api/recaps (list) and /api/recaps/<id>/render (scoped HTML) to serve.go,
        mirroring the existing plans handlers. Add a Recaps view panel to the dashboard
        SPA (cmd/wipnote/dashboard/js/app.js + index.html + css) reusing the
        openPlanDetail pattern and scopePlanCSS scoping so recap HTML injects safely.
      why: |
        Surfaces recaps in the same review surface as plans; reviewers see the visual
        recap without leaving the dashboard. Reuses proven plan-render plumbing.
      files:
        - cmd/wipnote/serve.go
        - cmd/wipnote/api_recaps.go
        - cmd/wipnote/dashboard/js/app.js
        - cmd/wipnote/dashboard/index.html
        - cmd/wipnote/dashboard/css/components.css
      deps:
        - 10
      done_when:
        - Recaps view lists committed recap artifacts and opens a detail panel with the rendered recap HTML
        - Recap CSS is scoped (no bleed into dashboard chrome), matching the plan-detail scoping approach
      effort: M
      risk: Low
      tests: |
        Integration: TestServeRecapsAPI (list + render endpoints return expected JSON/HTML).
        Manual smoke: open dashboard, view a recap.
      complexity: standard
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      critic_revisions:
        - source: local-design
          severity: warn
          summary: List endpoint requires the recaps SQLite table (slice-10); without it the handler would return empty or need a glob that diverges from plan/feature handlers.
        - source: local-feasibility
          severity: success
          summary: scopePlanCSS/openPlanDetail (api_plans.go:892, app.js:2002) + /api/plans/<id>/render (serve.go:132) are real and directly mirrorable for recaps.
      decisions_notes: |
        **Trigger:** dashboard navigation + fetch. **State:** read-only over committed recap HTML (no DB write path needed beyond a reindex of recap artifacts). **Payload:** /api/recaps -> [{id,title,workItem,created}]; /api/recaps/<id>/render -> scoped HTML. **Rejected:** a separate frontend framework (repo is vanilla JS + D3 — reuse openPlanDetail/scopePlanCSS verbatim).
        **Depends on slice-10's recaps table** — the list endpoint reads SQLite like every other list handler (no filesystem glob). Migration handled in slice-10, not here.
    - id: slice-5
      feature_id: feat-ecc95e7e
      num: 5
      title: /visual-recap skill (prompt wrapper) + build-ports to all 3 harnesses
      what: |
        Author plugin/skills/visual-recap/SKILL.md: a thin skill that runs
        `wipnote recap <scope>`, reads the produced RecapData/artifact, writes the outcome
        narrative grounded in the real diff (redacting secrets), and points the user to the
        dashboard recap URL. Then run `wipnote plugin build-ports` to fan out to
        Claude/Codex/Gemini trees. Do NOT touch project AGENTS.md/CLAUDE.md.
      why: |
        Gives users the BuilderIO /visual-recap ergonomics on wipnote's native engine,
        portable across all three harnesses from a single source.
      files:
        - plugin/skills/visual-recap/SKILL.md
      deps:
        - 3
      done_when:
        - SKILL.md has valid frontmatter (name, description) and drives the wipnote recap flow
        - '`wipnote plugin build-ports` regenerates Claude/Codex/Gemini trees with the new skill and the build passes'
      effort: S
      risk: Low
      tests: |
        `wipnote plugin build-ports` succeeds; generated trees contain visual-recap.
        Frontmatter validated by port/pluginbuild checks.
      complexity: standard
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      decisions_notes: |
        **Scope:** prompt-only skill; the engine is the Go command, not the skill (mirrors BuilderIO's zero-code skill design). **State:** none. **Rejected:** wiring the hosted Agent-Native Plans MCP (violates local-first non-negotiable); authoring AGENTS.md (plugin/project boundary — never own project instruction files).
    - id: slice-6
      feature_id: feat-96b98270
      num: 6
      title: Slice-schema block enrichment — additive optional structured blocks on PlanSlice
      what: |
        Extend plan/planyaml/schema.go PlanSlice with optional structured block fields
        (e.g. blocks: [] holding data-model / api-endpoint / file-tree / wireframe entries),
        keeping them OPTIONAL so existing v3 plans validate unchanged. Update
        plan/planyaml/validate.go to validate block shapes only when present. Add a
        `wipnote plan blocks` helper that lists the available block vocabulary (wipnote's
        local equivalent of BuilderIO get-plan-blocks).
      why: |
        Gives /wipnote:plan a richer visual vocabulary (the BuilderIO block catalog idea)
        without breaking any existing plan or requiring a schema-version bump.
      files:
        - plan/planyaml/schema.go
        - plan/planyaml/validate.go
        - cmd/wipnote/plan_blocks.go
      deps: []
      done_when:
        - New block fields are optional; all existing plan YAML still passes validate-yaml
        - When a block is present, its shape is validated (e.g. data-model fields, wireframe html token usage)
        - '`wipnote plan blocks` prints the supported block types and required fields'
      effort: M
      risk: Med
      tests: |
        Unit: TestValidate_BlocksOptional (old plan passes), TestValidate_BlockShapes
        (malformed block rejected). Round-trip marshal test.
      complexity: complex
      approved: true
      approval_status: approved
      comment: ""
      execution_status: promoted
      questions:
        - id: q-block-storage
          text: Should blocks be a flat slice-level list or nested under what/decisions?
          answer: 'A flat optional slice-level `blocks: []` list keyed by type — keeps the schema flat, renders in declared order, and avoids overloading the prose fields.'
      critic_revisions:
        - source: local-feasibility
          severity: success
          summary: Additive-optional blocks via yaml:omitempty are safe — validate.go:63-65 only checks schema_version is v3/empty, doesn't enumerate fields; no version bump needed.
      decisions_notes: |
        **Scope:** additive-optional schema; NO schema_version bump (back-compat preserved since fields are optional). **State:** stored in plan-*.yaml (canonical). **Payload:** blocks: list of typed entries reusing the shared block model from slice-2's plan/blocks package. **Rejected:** a v4 schema bump (unnecessary churn + migration risk for purely-optional additions); free-form markdown blocks (loses the structured/grounded property that makes blocks render well). **Dynamic catalog (web-verified 2026-06-18):** BuilderIO fetches block tags at runtime via get-plan-blocks ("tags drift, do not memorize"); `wipnote plan blocks` is the local equivalent — the renderer/skills must read the catalog, NOT hardcode tag names.
