        - source: haiku
          severity: LOW
          summary: Anomaly 'source' field is now defined per-kind (hook event id / two session ids + work item / table name).
      decisions_notes: |
        **Trigger:** daemon/reindex/db-health emit an anomaly event when a divergence condition is detected.
        **State:** CANONICAL events.ndjson record (survives rebuild) + derived `anomalies` table (rebuildable) — chosen over derived-only (ephemeral) or per-anomaly .html (heaviest).
        **Indexer:** reindex_otel_events.go is extended to recognize a new anomaly record type alongside OTel signals (the critic flagged this as previously unowned).
        **Payload:** {kind: conflict|stale_index|failed_hook_write|duplicate_agent, source, ts, detail, status: open|acked|resolved}. source is kind-specific: hook event id for failed/spooled writes; the two session ids + work-item id for duplicate_agent; table name for stale_index.
        **Duplicate-agent "active":** sessions/agent-activity row with in-progress status, last-update within a liveness window, and a claimed/started work item; overlap on one id = anomaly.
        **Rejected:** derived-only anomalies table (lost on reindex, not local-first); dedicated .wipnote/anomalies/*.html (heaviest — revisit only if anomalies need full lineage/linking).
