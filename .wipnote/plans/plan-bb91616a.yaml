          answer: Native custom elements with light DOM. The morph problem only exists if you keep innerHTML-blob replacement; components that patch their own fields solve it with zero dependencies, matching the existing hg-event-tree and the no-new-dependency constraint.
      decisions_notes: |
        **Trigger:** custom element connectedCallback subscribes to its projection; attributeChangedCallback / delta handler patches fields.
